name: Apply History Test sync resume fix

on:
  push:
    branches:
      - perf/drive-sync-event-driven

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'Stage History Test sync resume fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resume a real pending Drive push after sandbox exit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/preview_runtime.js')
          source = path.read_text(encoding='utf-8')
          old = '        RestorePreviewHistoricalBaseline();\n\n        console.info(\n            "[Letter Boxed Cubed][preview] Historical test mode disabled; " +\n            "real LBC state restored."\n        );'
          new = '        RestorePreviewHistoricalBaseline();\n\n        if (\n            CloudSyncDirty &&\n            CloudSyncSessionReady &&\n            !CloudSyncInFlight &&\n            CloudSyncConflictRevision === null\n        ) {\n            QueueCloudPush(250);\n        }\n\n        console.info(\n            "[Letter Boxed Cubed][preview] Historical test mode disabled; " +\n            "real LBC state restored."\n        );'
          if source.count(old) != 1:
              raise SystemExit(f'Expected one sandbox-exit block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
      - name: Commit fix
        run: |
          rm .github/workflows/apply-preview-history-sync-resume.yml
          git config user.name 'Nathan Burgdorff + Ari (ChatGPT)'
          git config user.email '6709230+Msyjsm@users.noreply.github.com'
          git add tools/preview_runtime.js .github/workflows/apply-preview-history-sync-resume.yml
          git commit -m 'Resume pending Drive push after History Test'
          git push origin HEAD:perf/drive-sync-event-driven
