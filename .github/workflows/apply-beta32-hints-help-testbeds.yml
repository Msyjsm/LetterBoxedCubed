name: Apply beta.32 Hints Help and Test Beds fixes

on:
  push:
    branches: [perf/drive-sync-event-driven]
    paths:
      - '.github/workflows/apply-beta32-hints-help-testbeds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/drive-sync-event-driven
          fetch-depth: 0

      - name: Apply beta.32 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('LetterBoxedCubed.user.js')
          s = source_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          s = replace_once(
              s,
              '// @version      1.13.1-beta.31',
              '// @version      1.13.1-beta.32',
              'version'
          )

          # The Chromium ::details-content wrapper is correctly bounded now;
          # make the Hints body actually consume that bounded height so its
          # nested First/Second columns inherit the remaining vertical space.
          s = replace_once(
              s,
              '''            .lb-cubed-hints-body {
                display: grid;
                grid-template-rows: auto minmax(0, 1fr);
                min-height: 0;
                overflow: hidden;
                padding: 5px;''',
              '''            .lb-cubed-hints-body {
                display: grid;
                flex: 1 1 0;
                grid-template-rows: auto minmax(0, 1fr);
                min-height: 0;
                height: 100%;
                overflow: hidden;
                padding: 5px;''',
              'Hints body full-height flex lane'
          )

          help_css = r'''

            /* Keep NYT's Help dropdown above the LBC dashboard and theme every
               menuitem consistently. NYT mixes <button> and <a> children, so
               the generic button theming otherwise produces alternating rows. */
            #help-dialog {
                z-index: 100050 !important;
            }

            html.lb-cubed-native-theme #help-dialog,
            html.lb-cubed-native-theme #help-dialog > li,
            html.lb-cubed-native-theme #help-dialog > li > button,
            html.lb-cubed-native-theme #help-dialog > li > a {
                background: var(--lb-cubed-lb-bg) !important;
                background-color: var(--lb-cubed-lb-bg) !important;
                color: var(--lb-cubed-lb-fg) !important;
                -webkit-text-fill-color: var(--lb-cubed-lb-fg) !important;
                border-color: var(--lb-cubed-lb-highlight) !important;
                --text: var(--lb-cubed-lb-fg);
            }

            html.lb-cubed-native-theme #help-dialog > li > button:hover,
            html.lb-cubed-native-theme #help-dialog > li > a:hover {
                background: color-mix(
                    in srgb,
                    var(--lb-cubed-lb-highlight) 18%,
                    var(--lb-cubed-lb-bg)
                ) !important;
            }

            html.lb-cubed-native-theme #help-dialog svg,
            html.lb-cubed-native-theme #help-dialog svg path {
                color: var(--lb-cubed-lb-fg) !important;
                fill: var(--lb-cubed-lb-fg) !important;
            }
'''
          marker = '            html.lb-cubed-theme-dark button[data-testid="modal-close"] {'
          if marker not in s:
              raise SystemExit('help-menu insertion marker missing')
          s = s.replace(marker, help_css + '\n' + marker, 1)
          source_path.write_text(s, encoding='utf-8')

          preview_path = Path('tools/preview_runtime.js')
          p = preview_path.read_text(encoding='utf-8')

          p = replace_once(
              p,
              '    let PreviewHistoricalSelectedTwoferKey = null;\n',
              '''    let PreviewHistoricalSelectedTwoferKey = null;
    let PreviewLongestWordsTestValue = "";
    let PreviewTestBedsObserver = null;
''',
              'Test Beds state'
          )

          # Test Beds section/input styling.
          css_marker = '''            #${PreviewHistoryTestPanelId} .lbc-history-test-actions {
'''
          testbed_css = '''            #${PreviewHistoryTestPanelId} .lbc-test-bed-section {
                margin: 10px 0;
                padding: 10px;
                border: 1px solid #555;
                border-radius: 4px;
                background: #202027;
            }

            #${PreviewHistoryTestPanelId} .lbc-test-bed-section > h3 {
                margin: 0 0 8px;
                font-size: 13px;
            }

            #${PreviewHistoryTestPanelId} .lbc-longest-words-test-input {
                width: 100%;
                min-height: 30px;
                padding: 4px 6px;
                border: 1px solid #777;
                border-radius: 3px;
                background: #101014;
                color: #fff;
                font: 12px/1.3 Consolas, "Courier New", monospace;
            }

'''
          if css_marker not in p:
              raise SystemExit('preview Test Beds CSS insertion marker missing')
          p = p.replace(css_marker, testbed_css + css_marker, 1)

          helpers = r'''
    function SanitizePreviewLongestWordsTestValue(Value) {
        return String(Value ?? "")
            .toUpperCase()
            .replace(/[^A-Z ,]/g, "");
    }

    function ApplyPreviewLongestWordsTest() {
        const Viewport = document.querySelector(
            `#${PanelId} .lb-cubed-longest-ticker`
        );
        if (!Viewport) {
            return;
        }

        const Desired = PreviewLongestWordsTestValue.trim();
        const OriginalKey = "lbcPreviewLongestOriginal";

        if (Desired) {
            if (!(OriginalKey in Viewport.dataset)) {
                Viewport.dataset[OriginalKey] = Viewport.textContent || "";
            }

            if (Viewport.textContent !== Desired) {
                Viewport.textContent = Desired;
                Viewport.scrollLeft = 0;
            }
            Viewport.title = Desired;
            return;
        }

        if (OriginalKey in Viewport.dataset) {
            const Original = Viewport.dataset[OriginalKey];
            Viewport.textContent = Original;
            Viewport.title = Original;
            Viewport.scrollLeft = 0;
            delete Viewport.dataset[OriginalKey];
        }
    }

    function EnsurePreviewTestBedsObserver() {
        if (PreviewTestBedsObserver) {
            return;
        }

        const Panel = document.getElementById(PanelId);
        if (!Panel) {
            return;
        }

        PreviewTestBedsObserver = new MutationObserver(() => {
            if (!PreviewLongestWordsTestValue.trim()) {
                return;
            }
            queueMicrotask(ApplyPreviewLongestWordsTest);
        });
        PreviewTestBedsObserver.observe(Panel, {
            childList: true,
            subtree: true
        });
    }

'''
          open_marker = '    function OpenPreviewHistoricalTestPanel() {'
          if open_marker not in p:
              raise SystemExit('OpenPreviewHistoricalTestPanel marker missing')
          p = p.replace(open_marker, helpers + open_marker, 1)

          p = replace_once(
              p,
              '''        Button.textContent = PreviewHistoricalTestModeActive
            ? "History Test (ACTIVE)"
            : "History Test";''',
              '''        Button.textContent = PreviewHistoricalTestModeActive
            ? "Test Beds (ACTIVE)"
            : "Test Beds";''',
              'Test Beds button label'
          )

          p = replace_once(
              p,
              '        Heading.textContent = "PREVIEW Historical Word Sandbox";',
              '        Heading.textContent = "Test Beds";',
              'Test Beds modal heading'
          )

          # Keep a visible input synchronized after Reset or any re-render.
          render_marker = '''        if (!Panel) {
            return;
        }
'''
          # This block occurs in several functions; anchor within the named function.
          function_marker = '    function RenderPreviewHistoricalTestPanel() {'
          idx = p.find(function_marker)
          if idx < 0:
              raise SystemExit('RenderPreviewHistoricalTestPanel missing')
          block_idx = p.find(render_marker, idx)
          if block_idx < 0:
              raise SystemExit('RenderPreviewHistoricalTestPanel guard missing')
          insert_at = block_idx + len(render_marker)
          p = p[:insert_at] + '''
        const LongestWordsInput = Panel.querySelector(
            '[data-lbc-longest-words-test="true"]'
        );
        if (
            LongestWordsInput &&
            LongestWordsInput.value !== PreviewLongestWordsTestValue
        ) {
            LongestWordsInput.value = PreviewLongestWordsTestValue;
        }
''' + p[insert_at:]

          # Reset must clear both test beds before the real panel is re-rendered.
          reset_marker = '''        Reset.addEventListener("click", () => {
            RestorePreviewHistoricalBaseline({ KeepActive: true });'''
          reset_replacement = '''        Reset.addEventListener("click", () => {
            PreviewLongestWordsTestValue = "";
            ApplyPreviewLongestWordsTest();
            RestorePreviewHistoricalBaseline({ KeepActive: true });'''
          p = replace_once(p, reset_marker, reset_replacement, 'Reset both test beds')

          # Exit must stop the scrolling mock as well as restore historical state.
          exit_marker = '''    function ExitPreviewHistoricalTestMode() {
        if (!PreviewHistoricalTestModeActive) {
            return;
        }

        RestorePreviewHistoricalBaseline();'''
          exit_replacement = '''    function ExitPreviewHistoricalTestMode() {
        if (!PreviewHistoricalTestModeActive) {
            return;
        }

        PreviewLongestWordsTestValue = "";
        ApplyPreviewLongestWordsTest();
        PreviewTestBedsObserver?.disconnect();
        PreviewTestBedsObserver = null;

        RestorePreviewHistoricalBaseline();'''
          p = replace_once(p, exit_marker, exit_replacement, 'Exit both test beds')

          # Replace the old single-sandbox append with two explicit test-bed sections.
          panel_append = '''        Panel.append(
            Heading,
            Warning,
            SelectLabel,
            Grid,
            Status,
            Footer
        );'''
          panel_append_new = '''        const HistoricalSection = document.createElement("section");
        HistoricalSection.className = "lbc-test-bed-section";
        const HistoricalHeading = document.createElement("h3");
        HistoricalHeading.textContent = "Historical Word Sandbox";
        HistoricalSection.append(
            HistoricalHeading,
            Warning,
            SelectLabel,
            Grid,
            Status
        );

        const LongestSection = document.createElement("section");
        LongestSection.className = "lbc-test-bed-section";
        const LongestHeading = document.createElement("h3");
        LongestHeading.textContent = "Longest Words Scrolling";
        const LongestInput = document.createElement("input");
        LongestInput.type = "text";
        LongestInput.className = "lbc-longest-words-test-input";
        LongestInput.dataset.lbcLongestWordsTest = "true";
        LongestInput.value = PreviewLongestWordsTestValue;
        LongestInput.placeholder = "LONGESTWORD, ANOTHERTIEDWORD";
        LongestInput.autocomplete = "off";
        LongestInput.spellcheck = false;
        LongestInput.addEventListener("input", () => {
            const Sanitized = SanitizePreviewLongestWordsTestValue(
                LongestInput.value
            );
            if (LongestInput.value !== Sanitized) {
                LongestInput.value = Sanitized;
            }
            PreviewLongestWordsTestValue = Sanitized;
            EnsurePreviewTestBedsObserver();
            ApplyPreviewLongestWordsTest();
        });
        LongestSection.append(LongestHeading, LongestInput);

        Panel.append(
            Heading,
            HistoricalSection,
            LongestSection,
            Footer
        );'''
          p = replace_once(p, panel_append, panel_append_new, 'two Test Beds sections')

          preview_path.write_text(p, encoding='utf-8')

          tests_path = Path('tests/final-polish-tests.js')
          t = tests_path.read_text(encoding='utf-8')
          t = replace_once(
              t,
              "assert(source.includes('// @version      1.13.1-beta.31'), 'beta.31 version missing');",
              "assert(source.includes('// @version      1.13.1-beta.32'), 'beta.32 version missing');",
              'test version'
          )
          marker = "console.log('PASS: beta.31 Hints full-height fill static checks');"
          if marker not in t:
              raise SystemExit('beta.31 test marker missing')
          block = r'''

// beta.32: finish Hints height propagation, repair Help dropdown layering/style,
// and expand preview History Test into general Test Beds.
assert(source.includes('.lb-cubed-hints-body {\n                display: grid;\n                flex: 1 1 0;'), 'Hints body does not flex through details-content');
assert(source.includes('height: 100%;\n                overflow: hidden;\n                padding: 5px;'), 'Hints body full-height constraint missing');
assert(source.includes('#help-dialog {\n                z-index: 100050 !important;'), 'Help dropdown z-index override missing');
assert(source.includes('#help-dialog > li > a {'), 'Help dropdown link theming missing');
assert(preview.includes('? "Test Beds (ACTIVE)"\n            : "Test Beds";'), 'Test Beds button rename missing');
assert(preview.includes('HistoricalHeading.textContent = "Historical Word Sandbox";'), 'Historical Word Sandbox section missing');
assert(preview.includes('LongestHeading.textContent = "Longest Words Scrolling";'), 'Longest Words Scrolling section missing');
assert(preview.includes('.replace(/[^A-Z ,]/g, "")'), 'Longest Words sanitizer missing');
assert(preview.includes('LongestInput.dataset.lbcLongestWordsTest = "true";'), 'Longest Words textbox missing');
assert(preview.includes('PreviewLongestWordsTestValue = "";\n            ApplyPreviewLongestWordsTest();'), 'Reset does not clear Longest Words test');
'''
          t = t.replace(marker, marker + block + "\nconsole.log('PASS: beta.32 Hints + Help + Test Beds static checks');", 1)
          tests_path.write_text(t, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js

      - name: Commit beta.32
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git add LetterBoxedCubed.user.js tools/preview_runtime.js tests/final-polish-tests.js
          git commit -m "Finish Hints sizing and add Preview Test Beds"
          git push origin HEAD:perf/drive-sync-event-driven
