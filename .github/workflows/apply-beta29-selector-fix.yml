name: Apply beta.29 gap selector fix

on:
  push:
    branches: [perf/drive-sync-event-driven]
    paths:
      - '.github/workflows/apply-beta29-selector-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/drive-sync-event-driven
          fetch-depth: 0

      - name: Fix bottom grip visibility selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('LetterBoxedCubed.user.js')
          s = p.read_text(encoding='utf-8')
          old = '''            .lb-game-container.lb-cubed-adjust-layout-gap > #${LayoutGapHandleId},
                      #${BottomLayoutGapHandleId} {
                          display: block;
                      }'''
          new = '''            .lb-game-container.lb-cubed-adjust-layout-gap > #${LayoutGapHandleId},
                      .lb-game-container.lb-cubed-adjust-layout-gap > #${BottomLayoutGapHandleId} {
                          display: block;
                      }'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one selector match, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check LetterBoxedCubed.user.js
          node tests/final-polish-tests.js

      - name: Commit selector fix
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git add LetterBoxedCubed.user.js
          git commit -m "Fix lower gap grip visibility selector"
          git push origin HEAD:perf/drive-sync-event-driven
