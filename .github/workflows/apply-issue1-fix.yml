name: Apply issue 1 fix

on:
  push:
    branches:
      - bugfix/issue-1-nonterminal-bootstrap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/tmp_issue1_patch.py
      - run: node --check LetterBoxedCubed.user.js
      - run: |
          rm tools/tmp_issue1_patch.py
          rm .github/workflows/apply-issue1-fix.yml
          git config user.name 'Nathan Burgdorff + Ari (ChatGPT)'
          git config user.email '6709230+Msyjsm@users.noreply.github.com'
          git add -A
          git commit -m 'Keep bootstrap waiting through NYT splash screen'
          git push origin HEAD:bugfix/issue-1-nonterminal-bootstrap
