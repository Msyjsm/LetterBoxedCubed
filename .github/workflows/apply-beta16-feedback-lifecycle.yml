name: Apply beta.16 feedback lifecycle

on:
  push:
    branches:
      - feature/qol-4-10-12-13-14
    paths:
      - .github/workflows/apply-beta16-feedback-lifecycle.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qol-4-10-12-13-14
          fetch-depth: 0

      - name: Apply beta.16 patch
        run: python tools/apply_beta16_feedback_lifecycle.py

      - name: Validate
        run: |
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js

      - name: Commit finalized source
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm .github/workflows/apply-beta16-feedback-lifecycle.yml
          git rm tools/apply_beta16_feedback_lifecycle.py
          git add LetterBoxedCubed.user.js CHANGELOG.md docs/PREVIEW_TESTING.md
          git commit -m "Stabilize valid-word toast lifecycle"
          git push origin HEAD:feature/qol-4-10-12-13-14

      - name: Rebuild Preview from finalized source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run preview-channel.yml --ref feature/qol-4-10-12-13-14
