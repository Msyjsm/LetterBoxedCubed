name: Apply beta.19 theme polish

on:
  push:
    branches:
      - perf/drive-sync-event-driven

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply beta.19 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('LetterBoxedCubed.user.js')
          tests_path = Path('tests/final-polish-tests.js')
          source = source_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              '// @version      1.13.1-beta.18',
              '// @version      1.13.1-beta.19',
              'userscript version'
          )

          source = replace_once(
              source,
              '        Input.style.width = `calc(${DigitCount}ch + 22px)`;',
              '        Input.style.width = `calc(${DigitCount + 1}ch + 22px)`;',
              'compact number width padding'
          )

          old_solution = '''    function GetDerivedNytSolutionText(Palette) {
        const Pole = GetThemeRelativeLuminance(Palette.NytSolution) < 0.38
            ? "#FFFFFF"
            : "#000000";
        return MixThemeColors(
            Palette.NytSolution,
            Pole,
            0.65
        );
    }
'''
          new_solution = '''    function GetDerivedNytSolutionText(Palette) {
        /*
            Keep the NYT-solution foreground as a true tint/shade of the
            selected solution color rather than washing it toward generic
            white/black. Preserve hue + saturation and move only HSL
            lightness far enough to recreate the original LBC-style contrast.
        */
        const [Red, Green, Blue] = ThemeHexToRgb(Palette.NytSolution)
            .map(Channel => Channel / 255);
        const Maximum = Math.max(Red, Green, Blue);
        const Minimum = Math.min(Red, Green, Blue);
        const Delta = Maximum - Minimum;
        const Lightness = (Maximum + Minimum) / 2;

        let Hue = 0;
        let Saturation = 0;
        if (Delta > 0) {
            Saturation = Delta / (1 - Math.abs(2 * Lightness - 1));
            if (Maximum === Red) {
                Hue = 60 * (((Green - Blue) / Delta) % 6);
            } else if (Maximum === Green) {
                Hue = 60 * (((Blue - Red) / Delta) + 2);
            } else {
                Hue = 60 * (((Red - Green) / Delta) + 4);
            }
            if (Hue < 0) {
                Hue += 360;
            }
        }

        const IsDark = GetThemeRelativeLuminance(Palette.NytSolution) < 0.38;
        const TargetLightness = IsDark
            ? 1 - (1 - Lightness) * 0.24
            : Lightness * 0.24;
        const Chroma = (1 - Math.abs(2 * TargetLightness - 1)) * Saturation;
        const HueSector = Hue / 60;
        const Secondary = Chroma * (1 - Math.abs((HueSector % 2) - 1));
        let R1 = 0;
        let G1 = 0;
        let B1 = 0;

        if (HueSector < 1) {
            [R1, G1, B1] = [Chroma, Secondary, 0];
        } else if (HueSector < 2) {
            [R1, G1, B1] = [Secondary, Chroma, 0];
        } else if (HueSector < 3) {
            [R1, G1, B1] = [0, Chroma, Secondary];
        } else if (HueSector < 4) {
            [R1, G1, B1] = [0, Secondary, Chroma];
        } else if (HueSector < 5) {
            [R1, G1, B1] = [Secondary, 0, Chroma];
        } else {
            [R1, G1, B1] = [Chroma, 0, Secondary];
        }

        const Match = TargetLightness - Chroma / 2;
        return ThemeRgbToHex([
            (R1 + Match) * 255,
            (G1 + Match) * 255,
            (B1 + Match) * 255
        ]);
    }
'''
          source = replace_once(
              source,
              old_solution,
              new_solution,
              'NYT solution tint/shade derivation'
          )

          source = replace_once(
              source,
              '                font-size: calc(1em + 2px);',
              '                font-size: calc(1em + 5px);',
              'NYT solution star size'
          )

          source = replace_once(
              source,
              '''                scrollbar-color:
                    var(--lb-cubed-lbc-border, #4C2222)
                    color-mix(''',
              '''                scrollbar-color:
                    var(--lb-cubed-lbc-text, #301818)
                    color-mix(''',
              'LBC scrollbar standards thumb color'
          )

          source = replace_once(
              source,
              '''            #${PanelContentId}::-webkit-scrollbar-thumb,
            #${PanelId} *::-webkit-scrollbar-thumb,
            #${HistoryOverlayId} *::-webkit-scrollbar-thumb {
                background: var(--lb-cubed-lbc-border, #4C2222);
                border-radius: 4px;
            }
''',
              '''            #${PanelContentId}::-webkit-scrollbar-thumb,
            #${PanelId} *::-webkit-scrollbar-thumb,
            #${HistoryOverlayId} *::-webkit-scrollbar-thumb {
                background: var(--lb-cubed-lbc-text, #301818);
                border-radius: 4px;
            }
''',
              'LBC webkit scrollbar thumb color'
          )

          source = replace_once(
              source,
              '''            #${PanelContentId}::-webkit-scrollbar-button,
            #${PanelId} *::-webkit-scrollbar-button,
            #${HistoryOverlayId} *::-webkit-scrollbar-button {
                color-scheme: var(--lb-cubed-control-color-scheme, light);
                background-color: var(--lb-cubed-lbc-heading-bg, #E5A09E);
            }
''',
              '''            #${PanelContentId}::-webkit-scrollbar-button,
            #${PanelId} *::-webkit-scrollbar-button,
            #${HistoryOverlayId} *::-webkit-scrollbar-button {
                color-scheme: var(--lb-cubed-control-color-scheme, light);
                background-color: var(--lb-cubed-lbc-text, #301818);
            }

            html.lb-cubed-native-theme::-webkit-scrollbar,
            html.lb-cubed-native-theme *::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            html.lb-cubed-native-theme::-webkit-scrollbar-track,
            html.lb-cubed-native-theme *::-webkit-scrollbar-track {
                background: var(--lb-cubed-lb-bg);
            }

            html.lb-cubed-native-theme::-webkit-scrollbar-thumb,
            html.lb-cubed-native-theme *::-webkit-scrollbar-thumb,
            html.lb-cubed-native-theme::-webkit-scrollbar-button,
            html.lb-cubed-native-theme *::-webkit-scrollbar-button {
                background: var(--lb-cubed-lb-fg);
            }
''',
              'scrollbar buttons and native-page webkit colors'
          )

          old_opacity = '''            html.lb-cubed-native-theme .lb-word-list,
            html.lb-cubed-native-theme .lb-word-list *,
            html.lb-cubed-native-theme .lb-word-list-length,
            html.lb-cubed-native-theme .lb-text-field-label,
            html.lb-cubed-native-theme .lb-text-field {
                opacity: 1 !important;
            }
'''
          new_opacity = '''            html.lb-cubed-native-theme .lb-word-list,
            html.lb-cubed-native-theme .lb-word-list *,
            html.lb-cubed-native-theme .lb-word-list-length,
            html.lb-cubed-native-theme .lb-par,
            html.lb-cubed-native-theme .lb-text-field-label,
            html.lb-cubed-native-theme .lb-text-field,
            html.lb-cubed-native-theme .lb-text-field * {
                opacity: 1 !important;
                filter: none !important;
                text-shadow: none !important;
                mix-blend-mode: normal !important;
            }
'''
          source = replace_once(
              source,
              old_opacity,
              new_opacity,
              'native foreground visual normalization'
          )

          tests = replace_once(
              tests,
              "assert(source.includes('// @version      1.13.1-beta.18'), 'beta.18 version missing');",
              "assert(source.includes('// @version      1.13.1-beta.19'), 'beta.19 version missing');",
              'test version'
          )
          tests = replace_once(
              tests,
              "assert(source.includes('font-size: calc(1em + 2px)'), 'NYT solution star +2px sizing missing');",
              "assert(source.includes('font-size: calc(1em + 5px)'), 'NYT solution star +5px sizing missing');",
              'star size test'
          )
          tests = replace_once(
              tests,
              "assert(source.includes('0.65'), 'NYT solution tint/shade derivation missing');",
              "assert(source.includes('const TargetLightness = IsDark'), 'NYT solution hue-preserving tint/shade derivation missing');",
              'solution derivation test'
          )

          insert_after = "assert(source.includes('ApplyCompactNumberInputWidth'), 'compact number input sizing missing');\n"
          addition = "assert(source.includes('DigitCount + 1}ch + 22px'), 'compact number inputs lack one-character breathing room');\n"
          if addition not in tests:
              if insert_after not in tests:
                  raise SystemExit('number-width test insertion point missing')
              tests = tests.replace(insert_after, insert_after + addition, 1)

          insert_after = "assert(source.includes('scrollbar-color:'), 'theme-aware scrollbar styling missing');\n"
          addition = "assert(source.includes('var(--lb-cubed-lbc-text, #301818)'), 'LBC scrollbar still uses stale border/maroon color');\n"
          if addition not in tests:
              if insert_after not in tests:
                  raise SystemExit('scrollbar test insertion point missing')
              tests = tests.replace(insert_after, insert_after + addition, 1)

          source_path.write_text(source, encoding='utf-8')
          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate source and regressions
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js

      - name: Commit beta.19 and remove patch workflow
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm -f .github/workflows/apply-beta19-theme-polish.yml
          git add LetterBoxedCubed.user.js tests/final-polish-tests.js
          git commit -m "Fix final theme polish regressions"
          git push origin HEAD:perf/drive-sync-event-driven
