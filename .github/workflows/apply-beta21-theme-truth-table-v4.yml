name: Apply beta.21 theme truth table v4

on:
  push:
    branches:
      - perf/drive-sync-event-driven

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair beta.21 patch helper boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_beta21_theme_truth_table.py')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
          '''source = replace_once(
              source,
              modal_anchor,
              modal_override + modal_anchor,
              "dark win-modal close button",
          )''',
          '''modal_index = source.find(modal_anchor)
          if modal_index < 0:
              raise RuntimeError("dark win-modal close button: anchor not found")
          source = source[:modal_index] + modal_override + source[modal_index:]'''
              ),
              (
          '''source = replace_between(
              source,
              board_row_start,
              board_row_end,
              ''' + "'''    function CreateThemeLinkedColorRow('''" + ''',
              "obsolete board-link control",
          )''',
          '''source = replace_between(
              source,
              board_row_start,
              board_row_end,
              "",
              "obsolete board-link control",
          )'''
              ),
              (
          '''source = replace_between(
              source,
              active_entry_start,
              active_entry_end,
              ''' + "'''            html.lb-cubed-native-theme .lb-text-field-underline {'''" + ''',
              "text-input active-color regression",
          )''',
          '''source = replace_between(
              source,
              active_entry_start,
              active_entry_end,
              "",
              "text-input active-color regression",
          )'''
              ),
              (
          '''            #${HistoryOverlayId} .lb-cubed-history-custom-word {
              background-color: var(--lb-cubed-nyt-solution) !important;
              color: var(--lb-cubed-nyt-solution-text) !important;
          }

          #${PanelId} .lb-cubed-nyt-solution-label {
              display: inline-flex;\'\'\'''',
          '''            #${HistoryOverlayId} .lb-cubed-history-custom-word {
              background-color: var(--lb-cubed-nyt-solution) !important;
              color: var(--lb-cubed-nyt-solution-text) !important;
          }
          \'\'\''''
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('expected helper fragment not found:\n' + old[:160])
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply beta.21 semantic theme fixes
        run: python tools/apply_beta21_theme_truth_table.py

      - name: Validate source and regressions
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js

      - name: Commit beta.21 and remove patch machinery
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm -f .github/workflows/apply-beta21-theme-truth-table.yml .github/workflows/apply-beta21-theme-truth-table-v2.yml .github/workflows/apply-beta21-theme-truth-table-v3.yml .github/workflows/apply-beta21-theme-truth-table-v4.yml tools/apply_beta21_theme_truth_table.py
          git add LetterBoxedCubed.user.js tests/final-polish-tests.js
          git commit -m "Implement LB semantic theme truth table"
          git push origin HEAD:perf/drive-sync-event-driven
