name: Apply toast lifecycle and debug bundle fix

on:
  push:
    branches:
      - perf/drive-sync-event-driven

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply toast lifecycle and debugger fixes
        run: python tools/apply_toast_lifecycle_and_debug_bundle_fix.py

      - name: Validate source and regressions
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js

      - name: Commit fix and remove patch machinery
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm -f .github/workflows/apply-toast-lifecycle-and-debug-bundle-fix.yml tools/apply_toast_lifecycle_and_debug_bundle_fix.py
          git add LetterBoxedCubed.user.js tools/preview_runtime.js tests/final-polish-tests.js docs/THEMES.md
          git commit -m "Decouple praise toast from NYT source lifetime"
          git push origin HEAD:perf/drive-sync-event-driven
