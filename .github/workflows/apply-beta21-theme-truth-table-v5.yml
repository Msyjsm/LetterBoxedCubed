name: Apply beta.21 theme truth table v5

on:
  push:
    branches:
      - perf/drive-sync-event-driven

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden beta.21 patch helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('tools/apply_beta21_theme_truth_table.py')
          s = p.read_text(encoding='utf-8')

          # Modal insertion: use the first matching CSS anchor; it appears twice.
          s, n = re.subn(
              r'''source = replace_once\(\n\s+source,\n\s+modal_anchor,\n\s+modal_override \+ modal_anchor,\n\s+"dark win-modal close button",\n\s+\)''',
              '''modal_index = source.find(modal_anchor)\nif modal_index < 0:\n    raise RuntimeError("dark win-modal close button: anchor not found")\nsource = source[:modal_index] + modal_override + source[modal_index:]''',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'modal repair count: {n}')

          # replace_between preserves its end marker, so replacement text must
          # never repeat that marker.
          s, n = re.subn(
              r'''source = replace_between\(\n\s+source,\n\s+board_row_start,\n\s+board_row_end,\n\s+''' + "'''    function CreateThemeLinkedColorRow\('''" + r''',\n\s+"obsolete board-link control",\n\s+\)''',
              '''source = replace_between(\n    source,\n    board_row_start,\n    board_row_end,\n    "",\n    "obsolete board-link control",\n)''',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'board-boundary repair count: {n}')

          s, n = re.subn(
              r'''source = replace_between\(\n\s+source,\n\s+active_entry_start,\n\s+active_entry_end,\n\s+''' + "'''            html\.lb-cubed-native-theme \.lb-text-field-underline \{'''" + r''',\n\s+"text-input active-color regression",\n\s+\)''',
              '''source = replace_between(\n    source,\n    active_entry_start,\n    active_entry_end,\n    "",\n    "text-input active-color regression",\n)''',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'active-entry boundary repair count: {n}')

          start = s.find("nyt_theme_new = '''")
          if start < 0:
              raise SystemExit('nyt_theme_new start missing')
          end = s.find("\nsource = replace_between(", start)
          if end < 0:
              raise SystemExit('nyt_theme_new end missing')
          corrected = '''nyt_theme_new = \'\'\'            #${PanelId} .lb-cubed-nyt-solution {
              background-color: var(--lb-cubed-nyt-solution) !important;
              border-color: color-mix(
                  in srgb,
                  var(--lb-cubed-nyt-solution-text) 52%,
                  transparent
              ) !important;
          }

          #${PanelId} .lb-cubed-nyt-solution-label {
              color: var(--lb-cubed-nyt-solution-text) !important;
              -webkit-text-fill-color: var(--lb-cubed-nyt-solution-text) !important;
          }

          #${HistoryOverlayId} .lb-cubed-history-custom-word {
              background-color: var(--lb-cubed-nyt-solution) !important;
              color: var(--lb-cubed-nyt-solution-text) !important;
          }

\'\'\''''
          s = s[:start] + corrected + s[end:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply beta.21 semantic theme fixes
        run: python tools/apply_beta21_theme_truth_table.py

      - name: Validate source and regressions
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js

      - name: Commit beta.21 and remove patch machinery
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm -f .github/workflows/apply-beta21-theme-truth-table.yml .github/workflows/apply-beta21-theme-truth-table-v2.yml .github/workflows/apply-beta21-theme-truth-table-v3.yml .github/workflows/apply-beta21-theme-truth-table-v4.yml .github/workflows/apply-beta21-theme-truth-table-v5.yml tools/apply_beta21_theme_truth_table.py
          git add LetterBoxedCubed.user.js tests/final-polish-tests.js
          git commit -m "Implement LB semantic theme truth table"
          git push origin HEAD:perf/drive-sync-event-driven
