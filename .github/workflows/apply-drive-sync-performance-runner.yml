name: Run Drive sync performance patch

on:
  push:
    branches:
      - perf/drive-sync-event-driven

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and run staged patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-drive-sync-performance-fix.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate source syntax and existing tests"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script_lines = [line[10:] if line.startswith('          ') else line for line in lines]
          script = '\n'.join(script_lines) + '\n'
          Path('/tmp/apply_drive_sync_perf.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_drive_sync_perf.py

      - name: Validate source syntax and existing tests
        run: |
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js

      - name: Remove patch workflows and commit implementation
        run: |
          rm .github/workflows/apply-drive-sync-performance-fix.yml
          rm .github/workflows/apply-drive-sync-performance-runner.yml
          git config user.name 'Nathan Burgdorff + Ari (ChatGPT)'
          git config user.email '6709230+Msyjsm@users.noreply.github.com'
          git add LetterBoxedCubed.user.js .github/workflows/apply-drive-sync-performance-fix.yml .github/workflows/apply-drive-sync-performance-runner.yml
          git commit -m 'Make Drive sync event-driven and lightweight'
          git push origin HEAD:perf/drive-sync-event-driven
