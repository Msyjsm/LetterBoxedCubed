name: Apply beta.26 settings/display cleanup

on:
  push:
    branches:
      - perf/drive-sync-event-driven
    paths:
      - .github/workflows/apply-beta26-settings-display.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/drive-sync-event-driven
          fetch-depth: 0

      - name: Apply cleanup
        run: python tools/apply_beta26_cleanup.py

      - name: Validate
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js

      - name: Commit cleanup
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git add LetterBoxedCubed.user.js tests/final-polish-tests.js
          git commit -m "Refine theme bindings and Display settings"
          git push origin perf/drive-sync-event-driven
