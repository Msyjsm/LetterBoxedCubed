name: Apply beta.26 settings/display cleanup

on:
  push:
    branches:
      - perf/drive-sync-event-driven
    paths:
      - .github/workflows/apply-beta26-settings-display.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/drive-sync-event-driven
          fetch-depth: 0

      - name: Apply cleanup
        run: python tools/apply_beta26_cleanup.py

      - name: Normalize generated test assertions
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/final-polish-tests.js')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              "assert(source.includes('CompactTitleLayout &&\n            !HideNytGameTitle'), 'compact title hidden-state guard missing');",
              "assert(source.includes('CompactTitleLayout &&') && source.includes('!HideNytGameTitle;'), 'compact title hidden-state guard missing');"
          )
          for label in ['Header', 'Game title', 'Footer']:
              old = f"assert(!source.includes('CreateSettingsNumberWithReset(\n                \"{label} size\"'), '{label} size control still present');"
              new = f"assert(!source.includes('\\\"{label} size\\\"'), '{label} size control still present');"
              t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')

      - name: Validate
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js

      - name: Commit cleanup
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git add LetterBoxedCubed.user.js tests/final-polish-tests.js
          git commit -m "Refine theme bindings and Display settings"
          git push origin perf/drive-sync-event-driven
