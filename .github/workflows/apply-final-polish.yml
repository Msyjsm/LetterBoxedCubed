name: Apply final LBC polish

on:
  push:
    branches:
      - perf/drive-sync-event-driven

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden test-export patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('tools/apply_final_polish.py')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r"merge_tests = MERGE_TESTS\.read_text\(encoding=\"utf-8\"\)\n"
              r"merge_tests = replace_once\(.*?"
              r"merge_tests = merge_tests\.replace\(\"FormatVersion: 3,\", \"FormatVersion: 4,\"\)",
              re.S
          )
          replacement = '''merge_tests = MERGE_TESTS.read_text(encoding="utf-8")
          merge_tests = replace_once(
              merge_tests,
              "MigrateBackupToCurrent, MigrateBackupV2ToV3,",
              "MigrateBackupToCurrent, MigrateBackupV2ToV3, MigrateBackupV3ToV4,",
              "merge test migration export"
          )
          merge_tests = replace_once(
              merge_tests,
              "CreateEmptyGuiState, NormalizeGuiState, BuildCloudSyncData,",
              "CreateEmptyGuiState, NormalizeGuiState, BuildCloudSyncData,\\n      CreateDefaultThemeState, NormalizeThemeState, MergeThemeStates,",
              "merge test theme function exports"
          )
          merge_tests = replace_once(
              merge_tests,
              "HideParStorageKey, LineDrawingSpeedStorageKey,",
              "HideParStorageKey, LineDrawingSpeedStorageKey,\\n      ThemeStateStorageKey, ThemeStateVersion,",
              "merge test theme constant exports"
          )
          merge_tests = merge_tests.replace("FormatVersion: 3,", "FormatVersion: 4,")'''
          s2, count = pattern.subn(lambda _match: replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'expected one merge-test patch block, found {count}')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Apply issues 15, 20, and 30
        run: python tools/apply_final_polish.py
      - name: Validate source and regressions
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js
          python tools/build_preview.py \
            --source LetterBoxedCubed.user.js \
            --output "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js" \
            --preview-url "https://raw.githubusercontent.com/${{ github.repository }}/preview/LetterBoxedCubed.preview.user.js" \
            --build-number "local" \
            --preview-hash "#lbc-preview"
          node --check "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js"
      - name: Commit final polish and remove patch machinery
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm -f .github/workflows/apply-final-polish.yml tools/apply_final_polish.py
          git add LetterBoxedCubed.user.js tools/preview_runtime.js tests/merge-tests.js tests/cloud-sync-tests.js tests/final-polish-tests.js
          git commit -m "Complete responsive diagnostics and theme polish"
          git push origin HEAD:perf/drive-sync-event-driven
