name: Apply beta.15 native toast suppression

on:
  push:
    branches:
      - feature/qol-4-10-12-13-14
    paths:
      - .github/workflows/apply-beta15-native-toast-suppression.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qol-4-10-12-13-14
          fetch-depth: 0

      - name: Apply beta.15 patch and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('LetterBoxedCubed.user.js')
          changelog_path = Path('CHANGELOG.md')
          docs_path = Path('docs/PREVIEW_TESTING.md')

          source = source_path.read_text(encoding='utf-8')
          changelog = changelog_path.read_text(encoding='utf-8')
          docs = docs_path.read_text(encoding='utf-8')

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          source = once(
              source,
              '// @version      1.12.0-beta.14',
              '// @version      1.12.0-beta.15',
              'version'
          )

          source = once(
              source,
              '''    function GetNativeValidWordFeedbackSource() {
        return document.querySelector(
            ".lb-game-container > .lb-square-container > .lb-message-box.success-message"
        );
    }
''',
              '''    function GetNativeValidWordFeedbackSource() {
        const GameContainer = document.querySelector(
            ".lb-game-container"
        );

        if (!GameContainer) {
            return null;
        }

        /*
            Do not wait for NYT to add `success-message`. The first visible
            paint can happen while the toast is still only `.lb-message-box`,
            which is exactly how the native flash escaped beta.14's selector.
            Validation errors are nested in the text-field wrapper and carry
            `error-message`, so they remain outside this source set.
        */
        const Candidates = [
            ...GameContainer.querySelectorAll(
                ":scope > .lb-square-container .lb-message-box"
            ),
            ...GameContainer.querySelectorAll(
                ":scope > .lb-word-container > .lb-message-box:not(.error-message)"
            )
        ];

        return Candidates.find(Element =>
            !Element.classList.contains(
                "lb-cubed-valid-feedback-proxy"
            ) &&
            String(Element.textContent || "").trim()
        ) || null;
    }
''',
              'native feedback source'
          )

          source = once(
              source,
              '''            .lb-game-container.${LayoutClass}
            > .lb-square-container
            > .lb-message-box.success-message,
            .lb-cubed-valid-feedback-relocated-source {
                visibility: hidden !important;
                pointer-events: none !important;
            }
''',
              '''            /*
                Suppress NYT praise by LOCATION rather than by its eventual
                `success-message` class. NYT initially paints the box as a plain
                `.lb-message-box` and decorates it afterward, so class-based
                suppression was one mutation too late. Keep the native node in
                layout for geometry, but make every possible native rendering
                path visually inert before its first paint. Error messages live
                under `.lb-text-field-wrapper` and are deliberately untouched.
            */
            .lb-game-container.${LayoutClass}
            > .lb-square-container .lb-message-box,
            .lb-game-container.${LayoutClass}
            > .lb-word-container
            > .lb-message-box:not(.error-message),
            .lb-cubed-valid-feedback-relocated-source {
                visibility: hidden !important;
                opacity: 0 !important;
                clip-path: inset(100%) !important;
                animation: none !important;
                transition: none !important;
                pointer-events: none !important;
            }
''',
              'native toast css'
          )

          changelog = once(
              changelog,
              '# Changelog\n\n',
              '''# Changelog\n\n## 1.12.0-beta.15\n- Suppress NYT valid-word praise by DOM location from the moment a native `.lb-message-box` is inserted, rather than waiting for NYT to add the later `success-message` class. This closes the one-paint race that caused a native toast followed by Cubed's proxy.\n- Hardened native-toast suppression with visibility, opacity, clipping, animation, and transition overrides while preserving the source element's layout geometry for proxy positioning.\n- Broadened native praise discovery to the square-container message box (and direct word-container non-error fallback) without affecting nested `error-message` validation feedback.\n\n''',
              'changelog'
          )

          docs = once(
              docs,
              'The current source is `1.12.0-beta.14`.',
              'The current source is `1.12.0-beta.15`.',
              'docs version'
          )

          docs = once(
              docs,
              "NYT's native success box is hidden before paint, Cubed waits 60ms for accepted-word wrapping to settle, then either mirrors NYT's final rendered position or moves the proxy above TI if history would collide. One accepted submission owns one proxy/fade even if NYT mutates the native toast repeatedly.",
              "NYT's native praise box is suppressed immediately by DOM location even before NYT adds its later `success-message` class. Cubed waits 60ms for accepted-word wrapping to settle, then either mirrors the hidden native box's final rendered position or moves the proxy above TI if history would collide. One accepted submission owns one proxy/fade even if NYT mutates the native toast repeatedly.",
              'docs toast behavior'
          )

          source_path.write_text(source, encoding='utf-8')
          changelog_path.write_text(changelog, encoding='utf-8')
          docs_path.write_text(docs, encoding='utf-8')
          PY

          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js

      - name: Commit finalized source
        shell: bash
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm .github/workflows/apply-beta15-native-toast-suppression.yml
          git add LetterBoxedCubed.user.js CHANGELOG.md docs/PREVIEW_TESTING.md
          git commit -m "Suppress native toast before its first paint"
          git push origin HEAD:feature/qol-4-10-12-13-14

      - name: Rebuild Preview from finalized source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run preview-channel.yml --ref feature/qol-4-10-12-13-14
