name: Apply beta32 Test Beds
on:
  push:
    branches:
      - perf/drive-sync-event-driven
    paths:
      - .github/workflows/apply-beta32-test-beds.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/drive-sync-event-driven
          fetch-depth: 0
      - name: Patch preview test beds
        run: |
          python - <<'PY'
          from pathlib import Path
          pth = Path('tools/preview_runtime.js')
          s = pth.read_text(encoding='utf-8')
          def one(old, new, label):
              global s
              c = s.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {c}')
              s = s.replace(old, new, 1)

          one(
              '    let PreviewHistoricalSelectedTwoferKey = null;\n',
              '    let PreviewHistoricalSelectedTwoferKey = null;\n    let PreviewLongestWordsTestValue = "";\n    let PreviewTestBedsObserver = null;\n',
              'state'
          )

          css_marker = '            #${PreviewHistoryTestPanelId} .lbc-history-test-actions {\n'
          css = '''            #${PreviewHistoryTestPanelId} .lbc-test-bed-section {\n                margin: 10px 0;\n                padding: 10px;\n                border: 1px solid #555;\n                border-radius: 4px;\n                background: #202027;\n            }\n\n            #${PreviewHistoryTestPanelId} .lbc-test-bed-section > h3 {\n                margin: 0 0 8px;\n                font-size: 13px;\n            }\n\n            #${PreviewHistoryTestPanelId} .lbc-longest-words-test-input {\n                width: 100%;\n                min-height: 30px;\n                padding: 4px 6px;\n                border: 1px solid #777;\n                border-radius: 3px;\n                background: #101014;\n                color: #fff;\n                font: 12px/1.3 Consolas, "Courier New", monospace;\n            }\n\n'''
          if css_marker not in s:
              raise SystemExit('css marker missing')
          s = s.replace(css_marker, css + css_marker, 1)

          helpers = '''    function SanitizePreviewLongestWordsTestValue(Value) {\n        return String(Value ?? "")\n            .toUpperCase()\n            .replace(/[^A-Z ,]/g, "");\n    }\n\n    function ApplyPreviewLongestWordsTest() {\n        const Viewport = document.querySelector(\n            `#${PanelId} .lb-cubed-longest-ticker`\n        );\n        if (!Viewport) {\n            return;\n        }\n\n        const Desired = PreviewLongestWordsTestValue.trim();\n        const OriginalKey = "lbcPreviewLongestOriginal";\n\n        if (Desired) {\n            if (!(OriginalKey in Viewport.dataset)) {\n                Viewport.dataset[OriginalKey] = Viewport.textContent || "";\n            }\n            if (Viewport.textContent !== Desired) {\n                Viewport.textContent = Desired;\n                Viewport.scrollLeft = 0;\n            }\n            Viewport.title = Desired;\n            return;\n        }\n\n        if (OriginalKey in Viewport.dataset) {\n            const Original = Viewport.dataset[OriginalKey];\n            Viewport.textContent = Original;\n            Viewport.title = Original;\n            Viewport.scrollLeft = 0;\n            delete Viewport.dataset[OriginalKey];\n        }\n    }\n\n    function EnsurePreviewTestBedsObserver() {\n        if (PreviewTestBedsObserver) {\n            return;\n        }\n        const Panel = document.getElementById(PanelId);\n        if (!Panel) {\n            return;\n        }\n        PreviewTestBedsObserver = new MutationObserver(() => {\n            if (PreviewLongestWordsTestValue.trim()) {\n                queueMicrotask(ApplyPreviewLongestWordsTest);\n            }\n        });\n        PreviewTestBedsObserver.observe(Panel, { childList: true, subtree: true });\n    }\n\n'''
          marker = '    function OpenPreviewHistoricalTestPanel() {'
          if marker not in s:
              raise SystemExit('open marker missing')
          s = s.replace(marker, helpers + marker, 1)

          one(
              '        Button.textContent = PreviewHistoricalTestModeActive\n            ? "History Test (ACTIVE)"\n            : "History Test";',
              '        Button.textContent = PreviewHistoricalTestModeActive\n            ? "Test Beds (ACTIVE)"\n            : "Test Beds";',
              'button label'
          )
          one(
              '        Heading.textContent = "PREVIEW Historical Word Sandbox";',
              '        Heading.textContent = "Test Beds";',
              'modal heading'
          )

          one(
              '        Reset.addEventListener("click", () => {\n            RestorePreviewHistoricalBaseline({ KeepActive: true });',
              '        Reset.addEventListener("click", () => {\n            PreviewLongestWordsTestValue = "";\n            ApplyPreviewLongestWordsTest();\n            RestorePreviewHistoricalBaseline({ KeepActive: true });',
              'reset both beds'
          )

          one(
              '    function ExitPreviewHistoricalTestMode() {\n        if (!PreviewHistoricalTestModeActive) {\n            return;\n        }\n\n        RestorePreviewHistoricalBaseline();',
              '    function ExitPreviewHistoricalTestMode() {\n        if (!PreviewHistoricalTestModeActive) {\n            return;\n        }\n\n        PreviewLongestWordsTestValue = "";\n        ApplyPreviewLongestWordsTest();\n        PreviewTestBedsObserver?.disconnect();\n        PreviewTestBedsObserver = null;\n\n        RestorePreviewHistoricalBaseline();',
              'exit both beds'
          )

          old_append = '''        Panel.append(\n            Heading,\n            Warning,\n            SelectLabel,\n            Grid,\n            Status,\n            Footer\n        );'''
          new_append = '''        const HistoricalSection = document.createElement("section");\n        HistoricalSection.className = "lbc-test-bed-section";\n        const HistoricalHeading = document.createElement("h3");\n        HistoricalHeading.textContent = "Historical Word Sandbox";\n        HistoricalSection.append(HistoricalHeading, Warning, SelectLabel, Grid, Status);\n\n        const LongestSection = document.createElement("section");\n        LongestSection.className = "lbc-test-bed-section";\n        const LongestHeading = document.createElement("h3");\n        LongestHeading.textContent = "Longest Words Scrolling";\n        const LongestInput = document.createElement("input");\n        LongestInput.type = "text";\n        LongestInput.className = "lbc-longest-words-test-input";\n        LongestInput.dataset.lbcLongestWordsTest = "true";\n        LongestInput.value = PreviewLongestWordsTestValue;\n        LongestInput.placeholder = "LONGESTWORD, ANOTHERTIEDWORD";\n        LongestInput.autocomplete = "off";\n        LongestInput.spellcheck = false;\n        LongestInput.addEventListener("input", () => {\n            const Sanitized = SanitizePreviewLongestWordsTestValue(LongestInput.value);\n            if (LongestInput.value !== Sanitized) {\n                LongestInput.value = Sanitized;\n            }\n            PreviewLongestWordsTestValue = Sanitized;\n            EnsurePreviewTestBedsObserver();\n            ApplyPreviewLongestWordsTest();\n        });\n        LongestSection.append(LongestHeading, LongestInput);\n\n        Panel.append(Heading, HistoricalSection, LongestSection, Footer);'''
          one(old_append, new_append, 'two sections')

          # Keep the textbox synchronized when Reset re-renders sandbox status.
          fn = '    function RenderPreviewHistoricalTestPanel() {'
          pos = s.find(fn)
          if pos < 0:
              raise SystemExit('render function missing')
          guard = '        if (!Panel) {\n            return;\n        }\n'
          g = s.find(guard, pos)
          if g < 0:
              raise SystemExit('render guard missing')
          at = g + len(guard)
          sync = '''\n        const LongestWordsInput = Panel.querySelector(\n            '[data-lbc-longest-words-test="true"]'\n        );\n        if (LongestWordsInput && LongestWordsInput.value !== PreviewLongestWordsTestValue) {\n            LongestWordsInput.value = PreviewLongestWordsTestValue;\n        }\n'''
          s = s[:at] + sync + s[at:]
          pth.write_text(s, encoding='utf-8')

          t = Path('tests/final-polish-tests.js')
          x = t.read_text(encoding='utf-8')
          mark = "console.log('PASS: beta.31 Hints full-height fill static checks');"
          if mark not in x:
              raise SystemExit('test marker missing')
          extra = "\nassert(preview.includes('? \\\"Test Beds (ACTIVE)\\\"'), 'Test Beds button missing');\nassert(preview.includes('HistoricalHeading.textContent = \\\"Historical Word Sandbox\\\";'), 'Historical section missing');\nassert(preview.includes('LongestHeading.textContent = \\\"Longest Words Scrolling\\\";'), 'Longest Words section missing');\nassert(preview.includes('.replace(/[^A-Z ,]/g, \\\"\\\")'), 'Longest Words sanitizer missing');\n"
          x = x.replace(mark, mark + extra, 1)
          t.write_text(x, encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js
      - name: Commit
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git add tools/preview_runtime.js tests/final-polish-tests.js
          git commit -m "Expand Preview History Test into Test Beds"
          git push origin HEAD:perf/drive-sync-event-driven
