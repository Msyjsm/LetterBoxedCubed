name: Apply QoL beta.4 layout diagnosis fix

on:
  push:
    branches:
      - feature/qol-4-10-12-13-14
    paths:
      - .github/workflows/apply-qol-beta4-layout-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qol-4-10-12-13-14
          fetch-depth: 0

      - name: Apply beta.4 layout fixes and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('LetterBoxedCubed.user.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once('// @version      1.12.0-beta.3', '// @version      1.12.0-beta.4', 'version')

          # The source snapshots revealed the actual dead-zone mechanism:
          # the NYT game container has spare vertical room, and CSS Grid's
          # default align-content: normal/stretch expands the auto TI track to
          # consume it. As accepted-word rows grow, they consume that slack,
          # which is why the visible threshold fell by about one row-height at
          # a time. Pack the grid tracks at the top instead.
          replace_once(
              '''                justify-content: center !important;\n                align-items: start !important;\n                width: 100% !important;''',
              '''                justify-content: center !important;\n                align-items: start !important;\n                align-content: start !important;\n                width: 100% !important;''',
              'side-mode align-content'
          )

          replace_once(
              '''                justify-items: center !important;\n                align-items: start !important;\n                width: 100% !important;''',
              '''                justify-items: center !important;\n                align-items: start !important;\n                align-content: start !important;\n                width: 100% !important;''',
              'stacked-mode align-content'
          )

          # The user preference is semantically a gap BETWEEN the complete TI
          # and GB. Now that auto-track stretching is disabled, use the grid's
          # actual row-gap instead of padding the accepted-word list. This makes
          # 1px of setting equal 1px of visible separation in every word state.
          replace_once(
              '''                padding-bottom: var(--lb-cubed-layout-gap, 16px) !important;''',
              '''                padding-bottom: 0 !important;''',
              'remove list-container gap padding'
          )

          old_gap_set = '''        GameContainer.style.setProperty(\n            "--lb-cubed-left-column-gap",\n            "0px"\n        );'''
          new_gap_set = '''        GameContainer.style.setProperty(\n            "--lb-cubed-left-column-gap",\n            `${LayoutGapPx}px`\n        );'''
          count = text.count(old_gap_set)
          if count != 2:
              raise SystemExit(f'left-column gap setters: expected 2 occurrences, found {count}')
          text = text.replace(old_gap_set, new_gap_set)

          # Before the first accepted word NYT renders a special .lb-par.no-words
          # INSIDE .lb-text-field-wrapper, while the later par is a direct child
          # of .lb-word-container. Hide any descendant .lb-par so the preference
          # works in both DOM shapes.
          replace_once(
              '''            .lb-game-container.${LayoutClass}.lb-cubed-hide-par\n            > .lb-word-container\n            > .lb-par {''',
              '''            .lb-game-container.${LayoutClass}.lb-cubed-hide-par\n            > .lb-word-container .lb-par {''',
              'hide-par descendant selector'
          )

          # Remove the long-obsolete fixed-slot constant/comment. It has not
          # participated in layout since the newer grid implementation and now
          # describes behavior we explicitly do not want.
          obsolete = '''    /*\n        TI and GB are stacked in Cubed's left meta-column. Give TI a stable\n        vertical slot so accepting words cannot move GB up or down. The slot\n        is intentionally roomy enough for the active chain while keeping GB\n        close to the entry area; the page can still scroll if a very long\n        chain eventually outgrows it.\n    */\n    const StableWordAreaHeight = 250;\n\n'''
          if obsolete not in text:
              raise SystemExit('obsolete StableWordAreaHeight block not found')
          text = text.replace(obsolete, '', 1)

          path.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          ctext = changelog.read_text(encoding='utf-8')
          marker = '# Changelog\n\n'
          entry = '''## 1.12.0-beta.4\n- Fixed the TI/GB gap dead zone by preventing CSS Grid auto-track stretching and applying the preference as the actual TI-to-GB row gap.\n- Fixed Hide par before the first accepted word by supporting NYT's alternate no-words par DOM placement.\n\n'''
          if entry not in ctext:
              if marker not in ctext:
                  raise SystemExit('changelog heading not found')
              ctext = ctext.replace(marker, marker + entry, 1)
              changelog.write_text(ctext, encoding='utf-8')
          PY

          node --check LetterBoxedCubed.user.js

      - name: Commit implementation and remove one-shot tooling
        shell: bash
        run: |
          rm .github/workflows/apply-qol-beta4-layout-fix.yml
          git config user.name 'Nathan Burgdorff + Ari (ChatGPT)'
          git config user.email '6709230+Msyjsm@users.noreply.github.com'
          git add LetterBoxedCubed.user.js CHANGELOG.md .github/workflows/apply-qol-beta4-layout-fix.yml
          git commit -m 'Fix state-dependent TI to GB gap behavior'
          git push origin HEAD:feature/qol-4-10-12-13-14
