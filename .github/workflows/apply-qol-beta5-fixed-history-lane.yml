name: Apply QoL beta.5 fixed history lane

on:
  push:
    branches:
      - feature/qol-4-10-12-13-14
    paths:
      - .github/workflows/apply-qol-beta5-fixed-history-lane.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qol-4-10-12-13-14
          fetch-depth: 0

      - name: Apply beta.5 fixes and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('LetterBoxedCubed.user.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          def replace_count(old, new, expected, label):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} occurrences, found {count}')
              text = text.replace(old, new)

          replace_once('// @version      1.12.0-beta.4', '// @version      1.12.0-beta.5', 'version')

          # Preview-only bootstrap telemetry for reproducing issue #1 in a real
          # browser session (including restored/discarded tabs). Production pays
          # only the cost of the guarded function calls.
          replace_once(
              '    const PageWindow = typeof unsafeWindow !== "undefined" ? unsafeWindow : window;\n',
              '''    const PageWindow = typeof unsafeWindow !== "undefined" ? unsafeWindow : window;\n\n    const BootstrapDiagnostics = [];\n    const BootstrapDiagnosticSessionKey =\n        "LetterBoxedCubed_PreviewBootstrapTrace";\n\n    function RecordBootstrapDiagnostic(Stage, Details = {}) {\n        if (UserscriptBuildChannel !== "preview") {\n            return;\n        }\n\n        const NavigationEntry =\n            typeof performance?.getEntriesByType === "function"\n                ? performance.getEntriesByType("navigation")[0]\n                : null;\n\n        const Entry = {\n            Stage,\n            Timestamp: new Date().toISOString(),\n            ReadyState: document.readyState,\n            WasDiscarded: Boolean(document.wasDiscarded),\n            NavigationType: NavigationEntry?.type || null,\n            ...Details\n        };\n\n        BootstrapDiagnostics.push(Entry);\n        const Snapshot = BootstrapDiagnostics.slice(-100);\n\n        try {\n            sessionStorage.setItem(\n                BootstrapDiagnosticSessionKey,\n                JSON.stringify(Snapshot)\n            );\n        } catch {\n            // Diagnostics must never interfere with the game.\n        }\n\n        try {\n            PageWindow.__LetterBoxedCubedBootstrapTrace = Snapshot;\n        } catch {\n            // unsafeWindow/page-world exposure is diagnostic convenience only.\n        }\n\n        console.debug(\n            "[Letter Boxed Cubed][bootstrap]",\n            Entry\n        );\n    }\n\n    RecordBootstrapDiagnostic("userscript-channel-active");\n''',
              'bootstrap diagnostics insertion'
          )

          replace_once(
              '''    async function Initialize() {\n        AddStyles();''',
              '''    async function Initialize() {\n        RecordBootstrapDiagnostic("initialize-start");\n        AddStyles();''',
              'initialize diagnostic start'
          )

          replace_once(
              '''        console.log("[Letter Boxed Cubed] Initialized.", {''',
              '''        RecordBootstrapDiagnostic("initialize-complete", {\n            PuzzleId: GameData.id || null,\n            PrintDate: GameData.printDate || null\n        });\n\n        console.log("[Letter Boxed Cubed] Initialized.", {''',
              'initialize diagnostic completion'
          )

          wait_pattern = re.compile(
              r'    function WaitForGame\(\) \{.*?\n    \}\n\n    function LoadPuzzleData\(\)',
              re.S
          )
          wait_replacement = '''    function WaitForGame() {\n        RecordBootstrapDiagnostic("wait-for-game-start");\n\n        return new Promise((Resolve) => {\n            const StartTime = Date.now();\n            const TimeoutMs = 20000;\n            let SawGameData = false;\n            let SawWordContainer = false;\n            let SawSquareContainer = false;\n\n            const Timer = setInterval(() => {\n                const HasGameData =\n                    PageWindow.gameData &&\n                    Array.isArray(PageWindow.gameData.dictionary);\n\n                const HasWordContainer = Boolean(document.querySelector(\n                    ".lb-game-container .lb-word-container"\n                ));\n\n                const HasSquareContainer = Boolean(document.querySelector(\n                    ".lb-game-container .lb-square-container"\n                ));\n\n                if (HasGameData && !SawGameData) {\n                    SawGameData = true;\n                    RecordBootstrapDiagnostic("game-data-seen");\n                }\n\n                if (HasWordContainer && !SawWordContainer) {\n                    SawWordContainer = true;\n                    RecordBootstrapDiagnostic("word-container-seen");\n                }\n\n                if (HasSquareContainer && !SawSquareContainer) {\n                    SawSquareContainer = true;\n                    RecordBootstrapDiagnostic("square-container-seen");\n                }\n\n                if (HasGameData && HasWordContainer && HasSquareContainer) {\n                    clearInterval(Timer);\n                    RecordBootstrapDiagnostic("wait-for-game-ready", {\n                        ElapsedMs: Date.now() - StartTime\n                    });\n                    Resolve(true);\n                    return;\n                }\n\n                if (Date.now() - StartTime >= TimeoutMs) {\n                    clearInterval(Timer);\n                    RecordBootstrapDiagnostic("wait-for-game-timeout", {\n                        HasGameData: Boolean(HasGameData),\n                        HasWordContainer,\n                        HasSquareContainer\n                    });\n                    Resolve(false);\n                }\n            }, 250);\n        });\n    }\n\n    function LoadPuzzleData()'''
          text, count = wait_pattern.subn(wait_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'WaitForGame replacement: expected 1 match, found {count}')

          # The gap setting now means a fixed history lane between the input and
          # the board. Accepted words/par/feedback consume that reserved lane;
          # their intrinsic height never pushes GB downward.
          replace_once(
              '''    function StartLayoutObserver() {''',
              '''    function UpdateHistoryLaneGeometry(GameContainer, WordContainer) {\n        const TextFieldWrapper = WordContainer?.querySelector(\n            ":scope > .lb-text-field-wrapper"\n        );\n\n        if (!GameContainer || !TextFieldWrapper) {\n            return;\n        }\n\n        const InputHeight = Math.max(\n            1,\n            Math.ceil(TextFieldWrapper.getBoundingClientRect().height)\n        );\n\n        const HistoryLaneHeight = Math.round(\n            Clamp(LayoutGapPx, MinimumLayoutGap, MaximumLayoutGap)\n        );\n\n        GameContainer.style.setProperty(\n            "--lb-cubed-history-lane-height",\n            `${HistoryLaneHeight}px`\n        );\n\n        GameContainer.style.setProperty(\n            "--lb-cubed-word-area-height",\n            `${InputHeight + HistoryLaneHeight}px`\n        );\n    }\n\n    function StartLayoutObserver() {''',
              'history lane geometry function'
          )

          gap_property = '''        GameContainer.style.setProperty(\n            "--lb-cubed-layout-gap",\n            `${LayoutGapPx}px`\n        );'''
          gap_property_with_geometry = gap_property + '''\n\n        UpdateHistoryLaneGeometry(\n            GameContainer,\n            WordContainer\n        );'''
          replace_count(
              gap_property,
              gap_property_with_geometry,
              2,
              'history lane geometry calls'
          )

          replace_count(
              '''        GameContainer.style.setProperty(\n            "--lb-cubed-left-column-gap",\n            `${LayoutGapPx}px`\n        );''',
              '''        GameContainer.style.setProperty(\n            "--lb-cubed-left-column-gap",\n            "0px"\n        );''',
              2,
              'remove external grid gap'
          )

          replace_once(
              '''                grid-template-rows:\n                    auto\n                    var(--lb-cubed-square-height, auto) !important;''',
              '''                grid-template-rows:\n                    var(--lb-cubed-word-area-height, auto)\n                    var(--lb-cubed-square-height, auto) !important;''',
              'side fixed word track'
          )

          replace_once(
              '''                grid-template-rows:\n                    auto\n                    var(--lb-cubed-square-height, auto)\n                    auto !important;''',
              '''                grid-template-rows:\n                    var(--lb-cubed-word-area-height, auto)\n                    var(--lb-cubed-square-height, auto)\n                    auto !important;''',
              'stacked fixed word track'
          )

          replace_count(
              '''                height: auto !important;\n                min-height: 0 !important;\n                max-height: none !important;''',
              '''                height: var(--lb-cubed-word-area-height, auto) !important;\n                min-height: var(--lb-cubed-word-area-height, 0) !important;\n                max-height: var(--lb-cubed-word-area-height, none) !important;\n                overflow: hidden !important;''',
              2,
              'fixed word-container height blocks'
          )

          replace_once(
              '''                justify-content: flex-start !important;\n                overflow: visible !important;''',
              '''                justify-content: flex-start !important;\n                overflow: hidden !important;''',
              'word-container overflow'
          )

          replace_once(
              '''            > .lb-word-container\n            > .lb-text-field-wrapper {\n                order: 1;\n                flex: 0 0 auto;\n            }''',
              '''            > .lb-word-container\n            > .lb-text-field-wrapper {\n                order: 1;\n                position: relative !important;\n                flex: 0 0 auto;\n            }\n\n            /*\n                Before the first accepted word NYT nests the visible par inside\n                the text-field wrapper. Remove it from normal flow so that DOM\n                variant cannot change the measured input height/history lane.\n            */\n            .lb-game-container.${LayoutClass}\n            > .lb-word-container\n            > .lb-text-field-wrapper\n            > .lb-par.no-words {\n                position: absolute !important;\n                top: 100% !important;\n                left: 0 !important;\n                right: 0 !important;\n                margin-top: 10px !important;\n                transform: none !important;\n                z-index: 2;\n            }''',
              'no-words par removed from flow'
          )

          replace_once(
              '''            > .lb-word-container\n            > .lb-list-container {\n                order: 2;\n                flex: 0 0 auto;\n                height: auto !important;\n                min-height: 0 !important;\n                max-height: none !important;\n                padding-bottom: 0 !important;\n            }''',
              '''            > .lb-word-container\n            > .lb-list-container {\n                order: 2;\n                flex: 1 1 auto;\n                height: auto !important;\n                min-height: 0 !important;\n                max-height: 100% !important;\n                padding-bottom: 0 !important;\n                overflow-x: hidden !important;\n                overflow-y: auto !important;\n                scrollbar-width: thin;\n            }''',
              'scrollable history list'
          )

          replace_once(
              '''            .lb-game-container.${LayoutClass}.lb-cubed-hide-par\n            > .lb-word-container .lb-par {\n                display: none !important;\n            }''',
              '''            .lb-game-container.lb-cubed-hide-par\n            .lb-word-container .lb-par {\n                display: none !important;\n            }''',
              'layout-independent hide par'
          )

          # Eliminate the one-frame 0x0 logo collapse. Measure synchronously with
          # the placeholder temporarily removed from layout, then restore its
          # final square dimensions before the browser can paint.
          logo_pattern = re.compile(
              r'    function UpdateLogoPlaceholderSize\(Header, Placeholder, HeaderActions, SizeText\) \{.*?\n    \}\n\n    function RenderMainStats',
              re.S
          )
          logo_replacement = '''    function UpdateLogoPlaceholderSize(\n        Header = document.querySelector(".lb-cubed-header"),\n        Placeholder = document.querySelector(".lb-cubed-logo-placeholder"),\n        HeaderActions = document.querySelector(".lb-cubed-header-actions"),\n        SizeText = document.querySelector(".lb-cubed-logo-placeholder-size")\n    ) {\n        if (!Header || !Placeholder || !HeaderActions || !SizeText) {\n            return;\n        }\n\n        if (!Header.isConnected || !Placeholder.isConnected) {\n            return;\n        }\n\n        Placeholder.classList.add("lb-cubed-logo-placeholder-measuring");\n\n        const HeaderHeight = Math.ceil(\n            Header.getBoundingClientRect().height\n        );\n        const ActionHeight = Math.ceil(\n            HeaderActions.getBoundingClientRect().height\n        );\n        const Side = Math.max(\n            20,\n            Math.min(96, Math.max(HeaderHeight, ActionHeight))\n        );\n\n        Placeholder.classList.remove("lb-cubed-logo-placeholder-measuring");\n        Placeholder.style.width = `${Side}px`;\n        Placeholder.style.height = `${Side}px`;\n        SizeText.textContent = `${Side}px`;\n    }\n\n    function RenderMainStats'''
          text, count = logo_pattern.subn(logo_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'logo sizing replacement: expected 1 match, found {count}')

          replace_once(
              '''        UpdateLayoutGapHandleVisibility();\n        PositionLayoutGapResizeHandle();''',
              '''        UpdateLayoutGapHandleVisibility();\n        PositionLayoutGapResizeHandle();\n        UpdateLogoPlaceholderSize();''',
              'update logo on layout change'
          )

          replace_once(
              '''            .lb-cubed-header {\n                display: flex;''',
              '''            .lb-cubed-logo-placeholder-measuring {\n                position: absolute !important;\n                visibility: hidden !important;\n                width: 0 !important;\n                height: 0 !important;\n                pointer-events: none !important;\n            }\n\n            .lb-cubed-header {\n                display: flex;''',
              'logo measurement css'
          )

          path.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          ctext = changelog.read_text(encoding='utf-8')
          marker = '# Changelog\n\n'
          entry = '''## 1.12.0-beta.5\n- Reworked the TI/GB spacing control into a fixed-height, scrollable accepted-word history lane so NYT word wrapping cannot move the board.\n- Removed the one-frame 0x0 logo-placeholder measurement that caused LBC to blink on word acceptance.\n- Made Hide par independent of LBC layout state and the no-words DOM variant.\n- Added Preview-only bootstrap telemetry for reproducing the intermittent initial-load failure in issue #1.\n\n'''
          if entry not in ctext:
              if marker not in ctext:
                  raise SystemExit('changelog heading not found')
              ctext = ctext.replace(marker, marker + entry, 1)
              changelog.write_text(ctext, encoding='utf-8')
          PY

          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js

      - name: Commit implementation and remove one-shot tooling
        shell: bash
        run: |
          rm .github/workflows/apply-qol-beta5-fixed-history-lane.yml
          git config user.name 'Nathan Burgdorff + Ari (ChatGPT)'
          git config user.email '6709230+Msyjsm@users.noreply.github.com'
          git add LetterBoxedCubed.user.js CHANGELOG.md .github/workflows/apply-qol-beta5-fixed-history-lane.yml
          git commit -m 'Stabilize TI history lane and add bootstrap diagnostics'
          git push origin HEAD:feature/qol-4-10-12-13-14
