name: Apply beta.13 toast and history-scroll cleanup

on:
  push:
    branches:
      - feature/qol-4-10-12-13-14
    paths:
      - .github/workflows/apply-beta13-toast-scroll.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qol-4-10-12-13-14
          fetch-depth: 0

      - name: Apply patch and validate
        run: |
          python tools/apply_beta13.py
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js

      - name: Commit finalized beta.13
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm .github/workflows/apply-beta13-toast-scroll.yml tools/apply_beta13.py
          git add LetterBoxedCubed.user.js CHANGELOG.md docs/PREVIEW_TESTING.md
          git commit -m "Fix toast relocation and nested history scrollbars"
          git push origin HEAD:feature/qol-4-10-12-13-14

      - name: Rebuild Preview from finalized source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run preview-channel.yml --ref feature/qol-4-10-12-13-14
