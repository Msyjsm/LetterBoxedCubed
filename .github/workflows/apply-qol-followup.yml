name: Apply QoL Preview follow-up

on:
  push:
    paths:
      - '.github/workflows/apply-qol-followup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Preview follow-up and validate
        run: |
          python tools/apply_qol_followup.py
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js
          grep -Fq '// @version      1.12.0-beta.2' LetterBoxedCubed.user.js
          grep -Fq 'Line animation speed' LetterBoxedCubed.user.js
          grep -Fq 'Compact title layout' LetterBoxedCubed.user.js
          grep -Fq 'Hide Yesterday/Help row' LetterBoxedCubed.user.js
          grep -Fq 'Adjust layout gap between text input and letter box:' LetterBoxedCubed.user.js

      - name: Commit implementation and remove one-shot tooling
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm tools/apply_qol_followup.py
          git rm .github/workflows/apply-qol-followup.yml
          git add LetterBoxedCubed.user.js CHANGELOG.md
          git commit -m "Refine v1.12 QoL Preview behavior"
          git push origin HEAD:feature/qol-4-10-12-13-14
