name: Apply board canvas diagnostics

on:
  push:
    branches:
      - perf/drive-sync-event-driven

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add board canvas diagnostics
        run: python tools/apply_board_canvas_diagnostics.py
      - name: Validate
        run: |
          node --check tools/preview_runtime.js
          node tests/final-polish-tests.js
      - name: Commit diagnostics and remove patch machinery
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm -f .github/workflows/apply-board-canvas-diagnostics.yml tools/apply_board_canvas_diagnostics.py
          git add tools/preview_runtime.js tests/final-polish-tests.js
          git commit -m "Add preview board canvas diagnostics"
          git push origin HEAD:perf/drive-sync-event-driven
