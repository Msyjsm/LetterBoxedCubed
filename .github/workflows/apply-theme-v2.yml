name: Apply ThemeState v2 affine themes

on:
  push:
    branches:
      - perf/drive-sync-event-driven

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply ThemeState v2 patch
        run: python tools/apply_theme_v2_patch.py

      - name: Validate source and regressions
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js

      - name: Commit implementation and remove patch machinery
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm -f .github/workflows/apply-theme-v2.yml tools/apply_theme_v2_patch.py
          git add LetterBoxedCubed.user.js tests/final-polish-tests.js docs/THEMES.md
          git commit -m "Replace board inversion with semantic affine themes"
          git push origin HEAD:perf/drive-sync-event-driven
