name: Apply history modal top anchor

on:
  push:
    paths:
      - '.github/workflows/apply-history-top-anchor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch history modal layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('LetterBoxedCubed.user.js')
          s = p.read_text()

          pattern = r'(#\$\{HistoryOverlayId\}\s*\{.*?display:\s*flex;\s*)align-items:\s*center;(\s*justify-content:\s*center;)'
          s, count = re.subn(pattern, r'\1align-items: flex-start;\2\n                padding: 12px;', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'overlay alignment replacement count={count}')

          s, count = re.subn(r'max-height:\s*min\(820px,\s*90vh\);', 'max-height: calc(100vh - 24px);', s, count=1)
          if count != 1:
              raise SystemExit(f'modal max-height replacement count={count}')

          s = re.sub(
              r'(#\$\{HistoryOverlayId\}\s*\{\s*)padding:\s*8px;',
              r'\1padding: 12px;',
              s,
              count=1,
              flags=re.S
          )
          s = re.sub(
              r'(\.lb-cubed-history-modal\s*\{\s*)max-height:\s*94vh;',
              r'\1max-height: calc(100vh - 24px);',
              s,
              count=1,
              flags=re.S
          )

          p.write_text(s)
          PY
          node --check LetterBoxedCubed.user.js
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm .github/workflows/apply-history-top-anchor.yml
          git add LetterBoxedCubed.user.js
          git commit -m "Anchor cloud history browser to viewport top"
          git push origin HEAD:feature/issues-2-3-cloud-gui-state
