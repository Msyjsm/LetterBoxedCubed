name: Apply theme control polish

on:
  push:
    branches:
      - perf/drive-sync-event-driven

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix patch helper for default object parameters
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_theme_control_polish.py')
          s = p.read_text(encoding='utf-8')

          old_bounds = '    brace = text.find("{", start)\n'
          new_bounds = '''    signature_end = text.find(") {", start)
              if signature_end < 0:
                  raise RuntimeError(f"function body not found: {name}")
              brace = signature_end + 2
          '''
          if old_bounds not in s:
              raise SystemExit('function_bounds brace lookup not found')
          s = s.replace(old_bounds, new_bounds, 1)

          old = '''def edit_bridge_request(fn):
              fn = replace_once(
                  fn,
                  "    function GoogleDriveBridgeRequest(Action, Payload = {}) {",
                  "    function GoogleDriveBridgeRequest(Action, Payload = {}, RetryAttempt = 0) {",
                  "bridge retry signature"
              )
          '''
          if old not in s:
              raise SystemExit('bridge editor signature block not found')
          s = s.replace(old, 'def edit_bridge_request(fn):\n', 1)

          marker = 'source = edit_function(source, "GoogleDriveBridgeRequest", edit_bridge_request)'
          replacement = '''source = replace_once(
              source,
              "    function GoogleDriveBridgeRequest(Action, Payload = {}) {",
              "    function GoogleDriveBridgeRequest(Action, Payload = {}, RetryAttempt = 0) {",
              "bridge retry signature"
          )
          source = edit_function(source, "GoogleDriveBridgeRequest", edit_bridge_request)'''
          if marker not in s:
              raise SystemExit('bridge editor call not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply theme/control/Drive polish
        run: python tools/apply_theme_control_polish.py
      - name: Validate source and regressions
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js
      - name: Commit polish and remove patch machinery
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm -f .github/workflows/apply-theme-control-polish.yml tools/apply_theme_control_polish.py
          git add LetterBoxedCubed.user.js tests/cloud-sync-tests.js tests/final-polish-tests.js
          git commit -m "Polish theme-linked controls and Drive responses"
          git push origin HEAD:perf/drive-sync-event-driven
