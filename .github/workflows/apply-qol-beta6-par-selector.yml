name: Apply QoL beta.6 par selector fix

on:
  push:
    branches:
      - feature/qol-4-10-12-13-14
    paths:
      - .github/workflows/apply-qol-beta6-par-selector.yml

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qol-4-10-12-13-14
          fetch-depth: 0

      - name: Narrow Hide par selectors and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('LetterBoxedCubed.user.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '// @version      1.12.0-beta.5',
              '// @version      1.12.0-beta.6',
              'version'
          )

          replace_once(
              '''            .lb-game-container.lb-cubed-hide-par
            .lb-word-container .lb-par {
                display: none !important;
            }''',
              '''            /*
                Hide only NYT's actual par prompt. Validation messages such as
                "Too short" and "Not a valid word" also use lb-par styling,
                so a blanket descendant selector incorrectly suppressed them.

                NYT has two prompt DOM shapes:
                - zero words: nested .lb-par.no-words in the text wrapper
                - accepted words: direct-child .lb-par in the word container
            */
            .lb-game-container.lb-cubed-hide-par
            > .lb-word-container
            > .lb-par,
            .lb-game-container.lb-cubed-hide-par
            > .lb-word-container
            > .lb-text-field-wrapper
            > .lb-par.no-words {
                display: none !important;
            }''',
              'Hide par selector'
          )

          path.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          ctext = changelog.read_text(encoding='utf-8')
          marker = '# Changelog\n\n'
          entry = '''## 1.12.0-beta.6
- Narrowed Hide par to the two actual NYT par-prompt DOM shapes so validation feedback such as "Too short" and "Not a valid word" remains visible.

'''
          if entry not in ctext:
              if marker not in ctext:
                  raise SystemExit('changelog heading not found')
              ctext = ctext.replace(marker, marker + entry, 1)
              changelog.write_text(ctext, encoding='utf-8')
          PY

          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js

      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-qol-beta6-par-selector.yml
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git add LetterBoxedCubed.user.js CHANGELOG.md .github/workflows/apply-qol-beta6-par-selector.yml
          git commit -m "Preserve validation feedback when par is hidden"
          git push origin feature/qol-4-10-12-13-14

      - name: Rebuild Preview from updated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/preview-channel.yml/dispatches \
            -d '{"ref":"feature/qol-4-10-12-13-14"}'
