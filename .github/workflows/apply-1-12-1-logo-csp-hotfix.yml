name: Apply 1.12.1 logo CSP hotfix

on:
  push:
    branches:
      - hotfix/logo-csp
    paths:
      - .github/workflows/apply-1-12-1-logo-csp-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/logo-csp
          fetch-depth: 0

      - name: Apply 1.12.1 patch
        run: python tools/apply_1_12_1_logo_csp_hotfix.py

      - name: Validate production and preview builds
        run: |
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js

          grep -q '// @version      1.12.1' LetterBoxedCubed.user.js
          grep -q 'createImageBitmap(BlobValue)' LetterBoxedCubed.user.js
          grep -q 'document.createElement("canvas")' LetterBoxedCubed.user.js
          ! grep -q 'Logo.src = LogoPngDataUrl' LetterBoxedCubed.user.js
          ! grep -q 'data:image/png;base64,' LetterBoxedCubed.user.js

          python tools/build_preview.py \
            --source LetterBoxedCubed.user.js \
            --output "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js" \
            --preview-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/preview/LetterBoxedCubed.preview.user.js" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --preview-hash "#lbc-preview"

          node --check "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js"
          grep -q 'createImageBitmap(BlobValue)' "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js"

      - name: Commit finalized hotfix
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm .github/workflows/apply-1-12-1-logo-csp-hotfix.yml
          git rm tools/apply_1_12_1_logo_csp_hotfix.py
          git add LetterBoxedCubed.user.js CHANGELOG.md
          git commit -m "Fix embedded logo rendering under NYT CSP"
          git push origin HEAD:hotfix/logo-csp

      - name: Rebuild Preview from finalized source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run preview-channel.yml --ref hotfix/logo-csp
