name: Apply beta.12 geometry cleanup

on:
  push:
    branches:
      - feature/qol-4-10-12-13-14
    paths:
      - tools/apply_beta12_geometry_cleanup.py
      - .github/workflows/apply-beta12-geometry-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/qol-4-10-12-13-14
          fetch-depth: 0

      - name: Apply beta.12 patch
        run: python tools/apply_beta12_geometry_cleanup.py

      - name: Validate userscript and merge tests
        run: |
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js

      - name: Commit implementation and remove one-shot tooling
        run: |
          rm tools/apply_beta12_geometry_cleanup.py
          rm .github/workflows/apply-beta12-geometry-cleanup.yml
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git add -A
          git commit -m "Fix margin-aware TI GB geometry and preview header cleanup"
          git push origin HEAD:feature/qol-4-10-12-13-14

      - name: Rebuild Preview from final implementation commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run preview-channel.yml --ref feature/qol-4-10-12-13-14
