name: Apply preview sandbox polish

on:
  push:
    branches:
      - feature/global-word-memory-v1.13.0
    paths:
      - .github/workflows/apply-preview-sandbox-polish.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-word-memory-v1.13.0
          fetch-depth: 0

      - name: Apply preview sandbox polish
        run: python tools/apply_preview_sandbox_polish.py

      - name: Validate preview runtime and generated build
        run: |
          node --check tools/preview_runtime.js
          python tools/build_preview.py \
            --source LetterBoxedCubed.user.js \
            --output "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js" \
            --preview-url "https://raw.githubusercontent.com/Msyjsm/LetterBoxedCubed/preview/LetterBoxedCubed.preview.user.js" \
            --build-number "1313" \
            --preview-hash "#lbc-preview"
          node --check "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js"
          grep -q 'GetPreviewHistoricalAvailableTwofers' "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js"
          grep -q 'StartPreviewChromeObserver' "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js"
          grep -q 'lbcHistoryTestExit' "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js"

      - name: Commit preview-only polish
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm .github/workflows/apply-preview-sandbox-polish.yml
          git rm tools/apply_preview_sandbox_polish.py
          git add tools/preview_runtime.js
          git commit -m "Polish preview history sandbox"
          git push origin HEAD:feature/global-word-memory-v1.13.0

      - name: Rebuild Preview from finalized source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run preview-channel.yml --ref feature/global-word-memory-v1.13.0
