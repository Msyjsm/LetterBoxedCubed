name: Apply beta.24 cross-mode letter repair

on:
  push:
    branches:
      - perf/drive-sync-event-driven

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply beta.24 patch
        run: python tools/apply_beta24_theme_switch_letter_repair.py

      - name: Validate
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js

      - name: Commit and clean patch machinery
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm -f .github/workflows/apply-beta24-theme-switch-letter-repair.yml tools/apply_beta24_theme_switch_letter_repair.py
          git add LetterBoxedCubed.user.js tests/final-polish-tests.js docs/THEMES.md
          git commit -m "Repair cross-mode board letter source colors"
          git push origin HEAD:perf/drive-sync-event-driven
