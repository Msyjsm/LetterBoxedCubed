name: Finalize v1.11.0

on:
  push:
    paths:
      - '.github/workflows/finalize-v1.11.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize production release
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('LetterBoxedCubed.user.js')
          s = source.read_text()
          old = '// @version      1.11.0-beta.2'
          new = '// @version      1.11.0'
          if old not in s:
              raise SystemExit('Expected beta version header not found')
          s = s.replace(old, new, 1)
          source.write_text(s)

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace(
              '- Google Drive synchronization via a user-owned Google Apps Script bridge (currently in v1.11 beta development).',
              '- Google Drive synchronization via a user-owned Google Apps Script bridge.'
          )
          r = r.replace(
              'The v1.11 development branch can keep player data and portable GUI state synchronized through a small Google Apps Script bridge that runs under the player\'s own Google account.',
              'LBC v1.11 and later can keep player data and portable GUI state synchronized through a small Google Apps Script bridge that runs under the player\'s own Google account.'
          )
          readme.write_text(r)

          drive_doc = Path('docs/GoogleDriveSync.md')
          d = drive_doc.read_text()
          d = d.replace(
              '> Beta status: the Drive sync implementation is currently available through the LBC preview channel (`#lbc-preview`) while issues #2 and #3 are under joint testing.\n\n',
              '> Google Drive sync is available in LBC v1.11 and later.\n\n'
          )
          drive_doc.write_text(d)

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text()
          marker = '# Changelog\n\n'
          final_section = '''## 1.11.0\n- Added Google Drive synchronization through a user-owned Apps Script bridge with startup sync, read-merge-write semantics, revision-conflict retry, and local-only credentials.\n- Made manual import and cloud sync merge-safe so independent devices union Found Words, solved Twofers, custom words, and compatible metadata instead of overwriting one another.\n- Added portable GUI-state persistence and per-setting/per-section timestamps for conflict-safe multi-device merging; physical panel width remains device-local.\n- Added Browse History for spoiler-safe, found-only cloud history with first/previous/next/last navigation and top-of-viewport modal anchoring.\n- Fixed escaped newline text in dialogs and alerts.\n- Added backup schema v3, migration support, regression tests, Drive documentation, preview-channel tooling, and release documentation.\n\n'''
          if '## 1.11.0\n' not in c:
              c = c.replace(marker, marker + final_section, 1)
          changelog.write_text(c)

          versions = Path('versions')
          versions.mkdir(exist_ok=True)
          Path('versions/v1.11.0.user.js').write_text(s)
          Path('workplace-copy/LetterBoxedCubed.txt').write_text(s)
          PY

          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js

      - name: Commit finalized release and remove one-shot workflow
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm .github/workflows/finalize-v1.11.0.yml
          git add LetterBoxedCubed.user.js README.md CHANGELOG.md docs/GoogleDriveSync.md versions/v1.11.0.user.js workplace-copy/LetterBoxedCubed.txt
          git commit -m "Release v1.11.0"
          git push origin HEAD:feature/issues-2-3-cloud-gui-state

# retrigger after test harness stubs were completed
