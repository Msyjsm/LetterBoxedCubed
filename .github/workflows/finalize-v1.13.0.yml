name: Finalize v1.13.0 release

on:
  push:
    branches:
      - feature/global-word-memory-v1.13.0

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize release metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('LetterBoxedCubed.user.js')
          source = source_path.read_text(encoding='utf-8')
          old = '// @version      1.13.0-beta.2'
          new = '// @version      1.13.0'
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one {old!r}, found {source.count(old)}')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          if '## 1.13.0\n' not in changelog:
              release = '''## 1.13.0
- Added persistent global word memory: words found on earlier puzzles are recognized when valid on the current board and participate in Found Words, statistics, Words by Length, Hints, and partial/independent Twofer states without auto-solving exact pairs.
- Added compact per-word Letter Boxed signatures and a versioned lifetime-history index so current-board historical lookup remains fast without rescanning every past puzzle on normal startup.
- Added chronological Browse History backfill so each archived day inherits only words found on earlier days, with historical styling/provenance and live-current-day parity checks.
- Added Google Drive/export merge support for global word history and historical projections, preserving unioned vocabulary and earliest provenance.
- Suppressed new-word discovery highlighting when a word was already known from an earlier puzzle.
- Preview-only tooling now includes the safe History Test sandbox for deterministic historical/twofer testing; preview/debug/test code remains excluded from the production userscript.

'''
              marker = '# Changelog\n\n'
              if marker not in changelog:
                  raise SystemExit('CHANGELOG.md missing expected heading')
              changelog = changelog.replace(marker, marker + release, 1)
              changelog_path.write_text(changelog, encoding='utf-8')
          PY

      - name: Validate release
        run: |
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js
          grep -q '^// @version      1.13.0$' LetterBoxedCubed.user.js
          if grep -q 'PreviewHistoryTestButtonId' LetterBoxedCubed.user.js; then
            echo 'Preview History Test implementation leaked into production source.' >&2
            exit 1
          fi
          python tools/build_preview.py \
            --source LetterBoxedCubed.user.js \
            --output "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js" \
            --preview-url 'https://raw.githubusercontent.com/Msyjsm/LetterBoxedCubed/preview/LetterBoxedCubed.preview.user.js' \
            --build-number 999 \
            --preview-hash '#lbc-preview'
          node --check "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js"
          grep -q 'PreviewHistoryTestButtonId' "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js"

      - name: Commit finalized release
        run: |
          rm .github/workflows/finalize-v1.13.0.yml
          git config user.name 'Nathan Burgdorff + Ari (ChatGPT)'
          git config user.email '6709230+Msyjsm@users.noreply.github.com'
          git add LetterBoxedCubed.user.js CHANGELOG.md .github/workflows/finalize-v1.13.0.yml
          git commit -m 'Release v1.13.0 global word memory'
          git push origin HEAD:feature/global-word-memory-v1.13.0
