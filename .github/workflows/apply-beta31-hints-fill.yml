name: Apply beta.31 Hints fill fix

on:
  push:
    branches: [perf/drive-sync-event-driven]
    paths:
      - '.github/workflows/apply-beta31-hints-fill.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/drive-sync-event-driven
          fetch-depth: 0

      - name: Apply beta.31 fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('LetterBoxedCubed.user.js')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          replace_once('// @version      1.13.1-beta.30', '// @version      1.13.1-beta.31', 'version')

          old = '''            .lb-cubed-hint-counter-grid {
                display: grid;
                flex: 1 1 auto;
                min-height: 0;
                grid-template-columns:
                    repeat(auto-fit, minmax(125px, 1fr));
                grid-auto-rows: minmax(0, 1fr);
                gap: 5px;
                align-items: stretch;
                overflow: hidden;
            }'''
          new = '''            .lb-cubed-hint-counter-grid {
                display: grid;
                flex: 1 1 auto;
                min-height: 0;
                height: 100%;
                grid-template-columns:
                    repeat(auto-fit, minmax(125px, 1fr));
                grid-auto-rows: minmax(0, 1fr);
                gap: 5px;
                align-items: stretch;
                overflow: hidden;
            }'''
          replace_once(old, new, 'hint counter grid height')

          old = '''            .lb-cubed-potential-word-tree {
                min-width: 0;
                min-height: 0;
                max-height: 100%;
            }'''
          new = '''            .lb-cubed-potential-word-tree {
                min-width: 0;
                min-height: 0;
                height: 100%;
                max-height: 100%;
                align-self: stretch;
            }'''
          replace_once(old, new, 'hint subtree stretch')

          p.write_text(s, encoding='utf-8')

          t = Path('tests/final-polish-tests.js')
          x = t.read_text(encoding='utf-8')
          old_version = "assert(source.includes('// @version      1.13.1-beta.30'), 'beta.30 version missing');"
          new_version = "assert(source.includes('// @version      1.13.1-beta.31'), 'beta.31 version missing');"
          if old_version not in x:
              raise SystemExit('beta.30 test version marker missing')
          x = x.replace(old_version, new_version, 1)
          marker = "console.log('PASS: beta.30 details-content scrollport fix static checks');"
          if marker not in x:
              raise SystemExit('beta.30 test marker missing')
          block = '''\n// beta.31: nested Hints columns must stretch through the full available row height.\nassert(source.includes('.lb-cubed-hint-counter-grid {') && source.includes('height: 100%;'), 'Hints counter grid full-height stretch missing');\nassert(source.includes('.lb-cubed-potential-word-tree {') && source.includes('align-self: stretch;'), 'Hints subtrees are not stretched');\n'''
          x = x.replace(marker, block + "\nconsole.log('PASS: beta.31 Hints full-height fill static checks');", 1)
          t.write_text(x, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js

      - name: Commit beta.31
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git add LetterBoxedCubed.user.js tests/final-polish-tests.js
          git commit -m "Stretch Hints subcontainers to fill section height"
          git push origin HEAD:perf/drive-sync-event-driven
