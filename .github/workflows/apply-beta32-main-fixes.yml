name: Apply beta32 main fixes
on:
  push:
    branches:
      - perf/drive-sync-event-driven
    paths:
      - .github/workflows/apply-beta32-main-fixes.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/drive-sync-event-driven
          fetch-depth: 0
      - name: Patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('LetterBoxedCubed.user.js')
          s = p.read_text(encoding='utf-8')
          def one(old, new, label):
              global s
              c = s.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {c}')
              s = s.replace(old, new, 1)
          one('// @version      1.13.1-beta.31', '// @version      1.13.1-beta.32', 'version')
          one(
              '            .lb-cubed-hints-body {\n                display: grid;\n                grid-template-rows: auto minmax(0, 1fr);\n                min-height: 0;\n                overflow: hidden;\n                padding: 5px;',
              '            .lb-cubed-hints-body {\n                display: grid;\n                flex: 1 1 0;\n                grid-template-rows: auto minmax(0, 1fr);\n                min-height: 0;\n                height: 100%;\n                overflow: hidden;\n                padding: 5px;',
              'hints body'
          )
          marker = '            html.lb-cubed-theme-dark button[data-testid="modal-close"] {'
          if marker not in s:
              raise SystemExit('help marker missing')
          css = '''            #help-dialog {\n                z-index: 100050 !important;\n            }\n\n            html.lb-cubed-native-theme #help-dialog,\n            html.lb-cubed-native-theme #help-dialog > li,\n            html.lb-cubed-native-theme #help-dialog > li > button,\n            html.lb-cubed-native-theme #help-dialog > li > a {\n                background: var(--lb-cubed-lb-bg) !important;\n                background-color: var(--lb-cubed-lb-bg) !important;\n                color: var(--lb-cubed-lb-fg) !important;\n                -webkit-text-fill-color: var(--lb-cubed-lb-fg) !important;\n                border-color: var(--lb-cubed-lb-highlight) !important;\n                --text: var(--lb-cubed-lb-fg);\n            }\n\n            html.lb-cubed-native-theme #help-dialog > li > button:hover,\n            html.lb-cubed-native-theme #help-dialog > li > a:hover {\n                background: color-mix(in srgb, var(--lb-cubed-lb-highlight) 18%, var(--lb-cubed-lb-bg)) !important;\n            }\n\n            html.lb-cubed-native-theme #help-dialog svg,\n            html.lb-cubed-native-theme #help-dialog svg path {\n                color: var(--lb-cubed-lb-fg) !important;\n                fill: var(--lb-cubed-lb-fg) !important;\n            }\n\n'''
          s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests/final-polish-tests.js')
          x = t.read_text(encoding='utf-8')
          old = "assert(source.includes('// @version      1.13.1-beta.31'), 'beta.31 version missing');"
          new = "assert(source.includes('// @version      1.13.1-beta.32'), 'beta.32 version missing');"
          if old not in x:
              raise SystemExit('test version marker missing')
          x = x.replace(old, new, 1)
          mark = "console.log('PASS: beta.31 Hints full-height fill static checks');"
          if mark not in x:
              raise SystemExit('beta31 test marker missing')
          extra = "\nassert(source.includes('flex: 1 1 0;\\n                grid-template-rows: auto minmax(0, 1fr);'), 'Hints body flex fill missing');\nassert(source.includes('#help-dialog {\\n                z-index: 100050 !important;'), 'Help dropdown layering fix missing');\n"
          x = x.replace(mark, mark + extra, 1)
          t.write_text(x, encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check LetterBoxedCubed.user.js
          node --check tools/preview_runtime.js
          node tests/merge-tests.js
          node tests/cloud-sync-tests.js
          node tests/final-polish-tests.js
      - name: Commit
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git add LetterBoxedCubed.user.js tests/final-polish-tests.js
          git commit -m "Fix Hints height propagation and Help dropdown"
          git push origin HEAD:perf/drive-sync-event-driven
