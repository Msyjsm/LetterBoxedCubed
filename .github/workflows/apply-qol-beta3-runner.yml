name: Apply QoL beta.3 patch

on:
  push:
    branches:
      - feature/qol-4-10-12-13-14
    paths:
      - .github/workflows/apply-qol-beta3-runner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qol-4-10-12-13-14
          fetch-depth: 0

      - name: Apply beta.3 patch and validate
        run: |
          python tools/apply_qol_beta3.py
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js
          grep -Fq '// @version      1.12.0-beta.3' LetterBoxedCubed.user.js
          grep -Fq 'lb-cubed-logo-placeholder' LetterBoxedCubed.user.js
          grep -Fq 'position: absolute !important;' LetterBoxedCubed.user.js

      - name: Commit implementation and remove one-shot tooling
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm tools/apply_qol_beta3.py
          git rm .github/workflows/apply-qol-beta3-runner.yml
          git rm .github/workflows/apply-qol-beta3.yml
          git add LetterBoxedCubed.user.js
          git commit -m "Refine gap layout and add logo placeholder"
          git push origin HEAD:feature/qol-4-10-12-13-14
