name: Apply beta.11 layout and feedback fixes

on:
  push:
    branches:
      - feature/qol-4-10-12-13-14
    paths:
      - .github/workflows/apply-beta11-layout-feedback.yml

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qol-4-10-12-13-14
          fetch-depth: 0

      - name: Apply beta.11 patch and validate
        shell: bash
        run: |
          python tools/apply_beta11_layout_feedback.py
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js

      - name: Commit implementation and remove one-shot helpers
        shell: bash
        run: |
          rm tools/apply_beta11_layout_feedback.py
          rm .github/workflows/apply-beta11-layout-feedback.yml
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git add LetterBoxedCubed.user.js CHANGELOG.md docs/PREVIEW_TESTING.md tools/apply_beta11_layout_feedback.py .github/workflows/apply-beta11-layout-feedback.yml
          git commit -m "Fix TI GB overlap and relocate crowded feedback"
          git push origin feature/qol-4-10-12-13-14

      - name: Rebuild Preview from updated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/preview-channel.yml/dispatches \
            -d '{"ref":"feature/qol-4-10-12-13-14"}'
