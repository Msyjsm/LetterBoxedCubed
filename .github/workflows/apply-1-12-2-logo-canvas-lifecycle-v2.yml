name: Apply 1.12.2 logo canvas lifecycle hotfix v2

on:
  push:
    branches:
      - hotfix/logo-csp
    paths:
      - .github/workflows/apply-1-12-2-logo-canvas-lifecycle-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/logo-csp
          fetch-depth: 0

      - name: Apply 1.12.2 patch
        run: python tools/apply_1_12_2_logo_canvas_lifecycle.py

      - name: Validate production and preview builds
        run: |
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js
          python tools/build_preview.py \
            --source LetterBoxedCubed.user.js \
            --output "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js" \
            --preview-url "https://raw.githubusercontent.com/Msyjsm/LetterBoxedCubed/preview/LetterBoxedCubed.preview.user.js" \
            --build-number "112" \
            --preview-hash "#lbc-preview"
          node --check "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js"
          grep -q '@version      1.12.2' LetterBoxedCubed.user.js
          ! grep -q 'if (!Canvas?.isConnected)' LetterBoxedCubed.user.js
          grep -q 'createImageBitmap(BlobValue)' LetterBoxedCubed.user.js

      - name: Commit finalized hotfix
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm .github/workflows/apply-1-12-2-logo-canvas-lifecycle-v2.yml
          git rm .github/workflows/apply-1-12-2-logo-canvas-lifecycle.yml
          git rm tools/apply_1_12_2_logo_canvas_lifecycle.py
          git add LetterBoxedCubed.user.js CHANGELOG.md
          git commit -m "Fix logo canvas lifecycle rendering"
          git push origin HEAD:hotfix/logo-csp

      - name: Rebuild Preview from finalized source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run preview-channel.yml --ref hotfix/logo-csp
