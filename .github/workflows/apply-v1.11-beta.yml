name: Apply LBC v1.11 beta source patch

on:
  push:
    branches:
      - feature/issues-2-3-cloud-gui-state
    paths:
      - '.feature-bootstrap/READY'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified source patch
        shell: bash
        run: |
          set -euo pipefail

          # The beta patch is split into small text chunks because the connector
          # is much more reliable with several small writes than one large one.
          cat .feature-bootstrap/chunk-* > /tmp/lbc.patch.gz.b64

          test "$(wc -c < /tmp/lbc.patch.gz.b64)" -eq 12268
          echo "0580d6299d7862aa2bd817831ec7786f3fc61b6c97e044f940420e6d7d10dfb6  /tmp/lbc.patch.gz.b64" | sha256sum -c -

          base64 --decode /tmp/lbc.patch.gz.b64 | gzip -d > /tmp/lbc.patch
          echo "09abd1e64075139cedcace90b9cd1935168d66dceef4b8008b151077ac265e19  /tmp/lbc.patch" | sha256sum -c -

          git apply --check /tmp/lbc.patch
          git apply /tmp/lbc.patch

          # Temporary bootstrap artifacts should not survive in the feature.
          rm -rf .feature-bootstrap
          rm -f .github/workflows/apply-v1.11-beta.yml

          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git add -A
          git commit -m "Implement merge-safe GUI state and Google Drive sync beta"
          git push origin HEAD:feature/issues-2-3-cloud-gui-state
