name: Apply QoL beta.3 refinements

on:
  push:
    branches:
      - feature/qol-4-10-12-13-14
    paths:
      - .github/workflows/apply-qol-beta3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qol-4-10-12-13-14
          fetch-depth: 0

      - name: Apply beta.3 refinements and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('LetterBoxedCubed.user.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          def sub_once(pattern, replacement, label):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, found {count}')

          replace_once('// @version      1.12.0-beta.2', '// @version      1.12.0-beta.3', 'version')

          # The panel must not participate in row sizing. An absolutely-positioned
          # grid child can still occupy column 2 / both rows while the left-side
          # TI and GB determine their own natural vertical geometry.
          replace_once(
              '''            .lb-game-container.${SideModeClass} > #${PanelId} {
                grid-column: 2 !important;
                grid-row: 1 / span 2 !important;
                position: relative;
                align-self: stretch;
                width: var(--lb-cubed-panel-width) !important;
                min-width: var(--lb-cubed-panel-width) !important;
                max-width: var(--lb-cubed-panel-width) !important;
                min-height: 0;
            }''',
              '''            .lb-game-container.${SideModeClass} > #${PanelId} {
                grid-column: 2 !important;
                grid-row: 1 / span 2 !important;
                position: absolute !important;
                inset: 0 0 0 0;
                align-self: stretch;
                justify-self: stretch;
                width: var(--lb-cubed-panel-width) !important;
                min-width: var(--lb-cubed-panel-width) !important;
                max-width: var(--lb-cubed-panel-width) !important;
                height: auto !important;
                min-height: 0;
                max-height: none !important;
            }''',
              'side panel decoupling'
          )

          # Preserve the intended gap as extra space owned by NYT's list container.
          # Once the panel no longer stretches the rows, every pixel of this value
          # immediately changes the left column rather than merely moving the grip.
          replace_once(
              '''            .lb-game-container.${LayoutClass}
            > .lb-word-container
            > .lb-list-container {
                order: 2;
                flex: 0 0 auto;
                height: auto !important;
                min-height: 0 !important;
                max-height: none !important;
                padding-bottom: var(--lb-cubed-layout-gap, 16px) !important;
            }''',
              '''            .lb-game-container.${LayoutClass}
            > .lb-word-container
            > .lb-list-container {
                order: 2;
                flex: 0 0 auto;
                height: auto !important;
                min-height: 0 !important;
                max-height: none !important;
                padding-bottom: var(--lb-cubed-layout-gap, 16px) !important;
            }''',
              'list gap ownership guard'
          )

          # Replace Word Log with a live square placeholder for the forthcoming logo.
          sub_once(
              r'''        const Title = document\.createElement\("h2"\);\n        Title\.className = "lb-cubed-title";\n        Title\.textContent = "Word Log";\n\n        const DriveStatus''',
              '''        const LogoPlaceholder = document.createElement("div");
        LogoPlaceholder.className = "lb-cubed-logo-placeholder";
        LogoPlaceholder.setAttribute("aria-label", "Letter Boxed Cubed logo placeholder");

        const LogoSize = document.createElement("span");
        LogoSize.className = "lb-cubed-logo-placeholder-size";
        LogoPlaceholder.appendChild(LogoSize);

        const DriveStatus''',
              'header title placeholder'
          )

          replace_once(
              '''        const TitleRow = document.createElement("div");
        TitleRow.className = "lb-cubed-title-row";
        TitleRow.append(Title, DriveStatus);''',
              '''        const TitleRow = document.createElement("div");
        TitleRow.className = "lb-cubed-title-row";
        TitleRow.append(LogoPlaceholder, DriveStatus);''',
              'header title row'
          )

          replace_once(
              '''        Panel.appendChild(Header);
        UpdateGoogleDriveButton();
    }''',
              '''        Panel.appendChild(Header);
        UpdateGoogleDriveButton();
        UpdateLogoPlaceholderSize(Header, LogoPlaceholder, HeaderActions, LogoSize);
    }

    function UpdateLogoPlaceholderSize(Header, Placeholder, HeaderActions, SizeText) {
        if (!Header || !Placeholder || !HeaderActions || !SizeText) {
            return;
        }

        const Measure = () => {
            if (!Header.isConnected || !Placeholder.isConnected) {
                return;
            }

            /*
                Use the natural non-logo header height as the constraint. This
                prevents the square from increasing its own available height in
                a feedback loop while still letting it grow/shrink with wrapping.
            */
            Placeholder.style.width = "0px";
            Placeholder.style.height = "0px";

            requestAnimationFrame(() => {
                if (!Header.isConnected || !Placeholder.isConnected) {
                    return;
                }

                const HeaderHeight = Math.ceil(Header.getBoundingClientRect().height);
                const ActionHeight = Math.ceil(HeaderActions.getBoundingClientRect().height);
                const Side = Math.max(20, Math.min(96, Math.max(HeaderHeight, ActionHeight)));

                Placeholder.style.width = `${Side}px`;
                Placeholder.style.height = `${Side}px`;
                SizeText.textContent = `${Side}px`;
            });
        };

        Measure();

        if (typeof ResizeObserver !== "undefined") {
            const Observer = new ResizeObserver(Measure);
            Observer.observe(HeaderActions);
            Observer.observe(Header);
        }
    }''',
              'logo sizing helper'
          )

          # Settings should be comfortably readable. Native Chrome number spinners
          # are only partially styleable, but reducing their pseudo-element width
          # gives them less visual weight without replacing native behavior.
          replace_once('font-size: 10px;\n                font-weight: 800;', 'font-size: 12px;\n                font-weight: 800;', 'settings section title size')
          replace_once('font-size: 10px;\n                font-weight: 700;\n                line-height: 1.3;', 'font-size: 12px;\n                font-weight: 700;\n                line-height: 1.3;', 'settings subgroup title size')
          replace_once('font-size: 10px;\n            }\n\n            .lb-cubed-settings-checkbox {', 'font-size: 12px;\n            }\n\n            .lb-cubed-settings-checkbox {', 'settings row size')
          replace_once('font-size: 9px;\n            }\n\n            .lb-cubed-settings-mini-button {', 'font-size: 11px;\n            }\n\n            .lb-cubed-settings-mini-button {', 'settings suffix size')
          replace_once('font-size: 9px;\n                cursor: pointer;\n            }\n\n            .lb-cubed-settings-button-row {', 'font-size: 11px;\n                cursor: pointer;\n            }\n\n            .lb-cubed-settings-button-row {', 'settings reset size')

          number_marker = '''            .lb-cubed-settings-suffix {'''
          spinner_css = '''            .lb-cubed-settings-number-wrap input[type="number"]::-webkit-inner-spin-button,
            .lb-cubed-settings-number-wrap input[type="number"]::-webkit-outer-spin-button {
                margin: 0;
                width: 12px;
                height: 18px;
            }

'''
          replace_once(number_marker, spinner_css + number_marker, 'number spinner styling')

          # Replace obsolete title typography with the square placeholder styles.
          sub_once(
              r'''            \.lb-cubed-title \{.*?\n            \}\n\n            \.lb-cubed-subtitle''',
              '''            .lb-cubed-logo-placeholder {
                flex: 0 0 auto;
                display: grid;
                place-items: center;
                width: 28px;
                height: 28px;
                border: 1px solid rgba(76, 34, 34, 0.78);
                background: rgba(255, 255, 255, 0.08);
                color: rgba(48, 24, 24, 0.78);
                font-family: Consolas, "Courier New", monospace;
                font-size: 9px;
                font-weight: 700;
                line-height: 1;
                white-space: nowrap;
            }

            .lb-cubed-logo-placeholder-size {
                pointer-events: none;
            }

            .lb-cubed-subtitle''',
              'logo placeholder styles'
          )

          path.write_text(text, encoding='utf-8')
          PY

          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js
          grep -Fq '// @version      1.12.0-beta.3' LetterBoxedCubed.user.js
          grep -Fq 'position: absolute !important;' LetterBoxedCubed.user.js
          grep -Fq 'lb-cubed-logo-placeholder' LetterBoxedCubed.user.js
          grep -Fq 'font-size: 12px;' LetterBoxedCubed.user.js

      - name: Commit implementation and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm .github/workflows/apply-qol-beta3.yml
          git add LetterBoxedCubed.user.js
          git commit -m "Refine gap layout and add logo placeholder"
          git push origin HEAD:feature/qol-4-10-12-13-14
