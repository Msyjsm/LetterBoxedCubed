name: Apply QoL beta.7 debug inspector and keyboard shortcuts

on:
  push:
    branches:
      - feature/qol-4-10-12-13-14
    paths:
      - .github/workflows/apply-qol-beta7-debug-shortcuts.yml

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qol-4-10-12-13-14
          fetch-depth: 0

      - name: Apply beta.7 changes and validate
        run: |
          python tools/apply_beta7_patch.py
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js

      - name: Commit implementation and remove temporary tooling
        run: |
          rm .github/workflows/apply-qol-beta7-debug-shortcuts.yml
          rm tools/apply_beta7_patch.py
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git add LetterBoxedCubed.user.js CHANGELOG.md .github/workflows/apply-qol-beta7-debug-shortcuts.yml tools/apply_beta7_patch.py
          git commit -m "Add Preview DOM inspector and keyboard shortcuts"
          git push origin feature/qol-4-10-12-13-14

      - name: Rebuild Preview from updated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/preview-channel.yml/dispatches \
            -d '{"ref":"feature/qol-4-10-12-13-14"}'
