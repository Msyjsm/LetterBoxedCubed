# exact repair run
name: Apply 1.12.3 exact logo bytes

on:
  push:
    branches:
      - hotfix/logo-exact-bytes
    paths:
      - .github/workflows/apply-1-12-3-exact-logo-bytes.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/logo-exact-bytes
          fetch-depth: 0

      - name: Apply exact logo-byte patch
        run: python tools/apply_1_12_3_exact_logo_bytes.py

      - name: Validate source, image bytes, tests, and preview build
        run: |
          node --check LetterBoxedCubed.user.js
          node tests/merge-tests.js
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, struct, zlib
          expected_sha = '4198a3a363878ed16e09937ccc71a5277bd4fd431ac4cbed1508a5bb70b1402f'
          text = Path('LetterBoxedCubed.user.js').read_text(encoding='utf-8')
          m = re.search(r'const LogoPngBase64\s*=\s*\n\s*"([A-Za-z0-9+/=]+)";', text)
          assert m, 'LogoPngBase64 not found'
          b64 = m.group(1)
          assert len(b64) == 5876, len(b64)
          data = base64.b64decode(b64, validate=True)
          assert len(data) == 4406, len(data)
          assert hashlib.sha256(data).hexdigest() == expected_sha
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          pos = 8
          seen_iend = False
          while pos < len(data):
              n = struct.unpack('>I', data[pos:pos+4])[0]
              typ = data[pos+4:pos+8]
              payload = data[pos+8:pos+8+n]
              stored = struct.unpack('>I', data[pos+8+n:pos+12+n])[0]
              crc = zlib.crc32(typ)
              crc = zlib.crc32(payload, crc) & 0xffffffff
              assert crc == stored, f'CRC failure {typ!r}'
              pos += 12 + n
              if typ == b'IEND':
                  seen_iend = True
                  break
          assert seen_iend and pos == len(data)
          assert '@version      1.12.3' in text
          print('Exact original logo bytes verified:', expected_sha)
          PY
          python tools/build_preview.py \
            --source LetterBoxedCubed.user.js \
            --output "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js" \
            --preview-url "https://raw.githubusercontent.com/Msyjsm/LetterBoxedCubed/preview/LetterBoxedCubed.preview.user.js" \
            --build-number "113" \
            --preview-hash "#lbc-preview"
          node --check "$RUNNER_TEMP/LetterBoxedCubed.preview.user.js"

      - name: Commit finalized hotfix
        run: |
          git config user.name "Nathan Burgdorff + Ari (ChatGPT)"
          git config user.email "6709230+Msyjsm@users.noreply.github.com"
          git rm .github/workflows/apply-1-12-3-exact-logo-bytes.yml
          git rm tools/apply_1_12_3_exact_logo_bytes.py
          git add LetterBoxedCubed.user.js CHANGELOG.md
          git commit -m "Embed exact original logo bytes"
          git push origin HEAD:hotfix/logo-exact-bytes

      - name: Rebuild Preview from finalized source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run preview-channel.yml --ref hotfix/logo-exact-bytes
